<!-- ============================================================
     LEADS IMÓVEIS · CORREÇÃO FINAL "PUBLICAR TUDO NO SITE"
     ------------------------------------------------------------
     COMO USAR:
     1. Abra o arquivo do CRM (o mesmo do print, ex.: index.html do CRM).
     2. Apague estas 3 linhas que estão perto do final (elas dão erro 404):
           <script src="crm-leads-realtime.js?v=20260711-1"></script>
           <script src="crm-realtime-ui-fix.js?v=20260711-1"></script>
           <script src="crm-central-leads.js?v=20260711-2"></script>
        (pode apagar as 3; se preferir manter a primeira, apague pelo menos
         as duas que dão 404: crm-realtime-ui-fix.js e crm-central-leads.js)
     3. COLE ESTE BLOCO INTEIRO logo antes da tag </body>,
        DEPOIS de todos os outros <script>. Ele precisa ser o ÚLTIMO.
     4. Salve e suba o arquivo. Pronto.

     O QUE ESTE BLOCO FAZ:
     - Todo imóvel captado já entra como PUBLICADO no site (automático).
     - O campo "Publicar no site?" passa a vir como "Sim" por padrão.
     - DESLIGA a faxina que apagava imóveis do site ao salvar/editar.
     - O imóvel só sai do site quando você EXCLUIR de propósito no CRM.
     - Não mexe em leads, fotos, IA, temas nem em mais nada.
============================================================ -->
<script id="leadsPublicarTudoFinal2026">
(function () {
  "use strict";

  var TABELA_SITE = "properties";   // tabela real que o site lê (via public_properties)
  var CHAVE = "source_crm_id";      // liga o imóvel do CRM ao do site

  function cli() { return window.supabaseClient || window.leadsSupabaseClient || null; }
  function A(v) { return Array.isArray(v) ? v : []; }
  function aviso(m) { try { if (typeof toast === "function") toast(m); } catch (_) {} console.log("[PublicarTudo]", m); }

  // ---------------------------------------------------------
  // 1) NEUTRALIZA A FAXINA DESTRUTIVA DO PATCH ANTERIOR
  //    O patch antigo criava window.leadsSincronizarSite, que apagava
  //    imóveis do site. Aqui trocamos por uma versão que NÃO apaga nada
  //    (só reenvia os publicados). Assim o botão antigo fica seguro.
  // ---------------------------------------------------------
  function finalidadeSite(v) {
    var t = String(v || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    if (t.indexOf("tempor") >= 0 || t.indexOf("verao") >= 0) return "Temporada";
    if (t.indexOf("anual") >= 0 || t.indexOf("aluguel") >= 0 || t.indexOf("locac") >= 0) return "Aluguel Anual";
    return "Venda";
  }

  function fotoSrc(f) {
    if (!f) return "";
    if (typeof f === "string") return f;
    return f.url || f.publicUrl || f.data || f.src || f.image_url || "";
  }

  function fotosParaSite(p) {
    var lista = A(p.photos).map(fotoSrc).filter(Boolean);
    var urls = lista.filter(function (u) { return /^https?:\/\//i.test(u); });
    return (urls.length ? urls : lista).slice(0, 10);
  }

  function codigo(p) {
    if (p.code) return String(p.code);
    if (p.codigo) return String(p.codigo);
    var id = String(p.id || Date.now());
    if (id.indexOf("LI-") === 0) return id;
    return "LI-" + id.replace(/[^A-Za-z0-9]/g, "").slice(-8).toUpperCase();
  }

  function linhaSite(p) {
    var fotos = fotosParaSite(p);
    return {
      code: codigo(p),
      title: p.titulo || p.title || "Imóvel Leads Imóveis",
      purpose: finalidadeSite(p.finalidade || p.purpose),
      neighborhood: p.bairro || p.neighborhood || "Florianópolis",
      type: p.tipo || p.type || "Imóvel",
      price: Number(p.valor || p.price || 0),
      area: Number(p.area || 0),
      bedrooms: Number(p.dormitorios || p.bedrooms || 0),
      suites: Number(p.suites || 0),
      parking: Number(p.vagas || p.parking || 0),
      description: p.proximaAcao || p.description || "Imóvel selecionado pela Leads Imóveis.",
      photos: fotos,
      image_url: fotos[0] || null,
      status: "Publicado",
      is_public: true,
      source_crm_id: String(p.id || ""),
      updated_at: new Date().toISOString()
    };
  }

  // Envia/atualiza 1 imóvel no site. NUNCA remove (a menos que seja exclusão real).
  async function espelhar(p) {
    var c = cli();
    if (!c || !p || !p.id) return false;
    try {
      var linha = linhaSite(p);

      var achado = await c.from(TABELA_SITE).select("id").eq(CHAVE, linha.source_crm_id).maybeSingle();
      if (achado.error) throw achado.error;

      if (!achado.data) {
        achado = await c.from(TABELA_SITE).select("id").eq("code", linha.code).maybeSingle();
        if (achado.error) throw achado.error;
      }

      if (achado.data && achado.data.id) {
        var upd = await c.from(TABELA_SITE).update(linha).eq("id", achado.data.id);
        if (upd.error) throw upd.error;
      } else {
        var ins = await c.from(TABELA_SITE).insert(linha);
        if (ins.error) throw ins.error;
      }
      return true;
    } catch (e) {
      console.error("[PublicarTudo] erro ao espelhar:", e);
      aviso("Falha ao publicar no site. Verifique a tabela 'properties' e as permissões (RLS) no Supabase.");
      return false;
    }
  }

  // Remove do site — SÓ é chamada quando o imóvel é excluído de verdade no CRM.
  async function removerDoSite(p) {
    var c = cli();
    if (!c || !p) return;
    try {
      var id = String(p.id || "");
      var code = codigo(p);
      if (id) await c.from(TABELA_SITE).delete().eq(CHAVE, id);
      if (code) await c.from(TABELA_SITE).delete().eq("code", code);
    } catch (e) {
      console.error("[PublicarTudo] erro ao remover:", e);
    }
  }

  // Publica TODOS os imóveis do CRM no site (sem apagar sobras).
  async function publicarTodos(mostrar) {
    var c = cli();
    if (!c) { if (mostrar) aviso("Supabase ainda carregando. Tente de novo em instantes."); return; }
    var lista = A(window.db && db.imoveis);
    var ok = 0;
    for (var i = 0; i < lista.length; i++) {
      var feito = await espelhar(lista[i]);
      if (feito) ok++;
    }
    if (mostrar) aviso("Site atualizado: " + ok + " imóvel(is) publicado(s). Nenhum foi apagado.");
  }

  // Substitui a função destrutiva antiga por esta versão segura.
  window.leadsSincronizarSite = function (mostrar) { return publicarTodos(mostrar); };
  window.leadsPublicarTodosNoSite = publicarTodos;

  // ---------------------------------------------------------
  // 2) MARCA TODO IMÓVEL COMO PUBLICADO AO SALVAR
  //    "Abraça" as funções de salvar já existentes, força
  //    publicarSite = true e espelha no site automaticamente.
  // ---------------------------------------------------------
  function maisRecente() {
    return A(window.db && db.imoveis).slice().sort(function (a, b) {
      return (Number(b.updated) || 0) - (Number(a.updated) || 0);
    })[0] || null;
  }

  function forcarPublicado(p) {
    if (!p) return;
    p.publicarSite = true;
    p.is_public = true;
    // não força a etapa para "Publicado" para não bagunçar seu funil de captação,
    // mas garante que o site receba (is_public/publicarSite já bastam).
  }

  function abracarSalvar(nome) {
    var orig = window[nome];
    if (typeof orig !== "function" || orig.__pubWrap) return;
    var novo = async function () {
      var r = await orig.apply(this, arguments);
      try {
        var p = maisRecente();
        if (p) { forcarPublicado(p); await espelhar(p); if (typeof safeLocalSave === "function") safeLocalSave(db); }
      } catch (e) { console.error(e); }
      return r;
    };
    novo.__pubWrap = true;
    window[nome] = novo;
  }

  function abracarFoto(nome) {
    var orig = window[nome];
    if (typeof orig !== "function" || orig.__pubWrap) return;
    var novo = async function (propId) {
      var r = await orig.apply(this, arguments);
      try {
        var p = A(window.db && db.imoveis).find(function (x) { return x.id === propId; });
        if (p) { forcarPublicado(p); await espelhar(p); }
      } catch (e) { console.error(e); }
      return r;
    };
    novo.__pubWrap = true;
    window[nome] = novo;
  }

  // Exclusão real → aí sim remove do site.
  function abracarExcluir() {
    var orig = window.deleteImovel;
    if (typeof orig !== "function" || orig.__pubWrap) return;
    var novo = async function (id) {
      var antes = A(window.db && db.imoveis).find(function (x) { return x.id === id; });
      var qtdAntes = A(window.db && db.imoveis).length;
      var r = await orig.apply(this, arguments);
      var qtdDepois = A(window.db && db.imoveis).length;
      try { if (antes && qtdDepois < qtdAntes) await removerDoSite(antes); } catch (e) { console.error(e); }
      return r;
    };
    novo.__pubWrap = true;
    window.deleteImovel = novo;
  }

  // ---------------------------------------------------------
  // 3) DEIXA O CAMPO "PUBLICAR NO SITE?" COM "SIM" POR PADRÃO
  //    Ao abrir o cadastro de um imóvel novo, seleciona "Sim".
  // ---------------------------------------------------------
  function abracarModal() {
    var orig = window.openImovelModal;
    if (typeof orig !== "function" || orig.__pubWrap) return;
    var novo = function () {
      var r = orig.apply(this, arguments);
      try {
        setTimeout(function () {
          var sel = document.getElementById("p_publicar");
          if (!sel) return;
          // Só mexe se for imóvel novo (nenhuma opção "sim" já selecionada).
          var jaSim = Array.prototype.some.call(sel.options, function (o) {
            return o.value === "sim" && o.selected;
          });
          var ehNovo = !(currentEdit && currentEdit.id);
          if (ehNovo || !jaSim) {
            Array.prototype.forEach.call(sel.options, function (o) {
              o.selected = (o.value === "sim");
            });
          }
        }, 60);
      } catch (e) { console.error(e); }
      return r;
    };
    novo.__pubWrap = true;
    window.openImovelModal = novo;
  }

  // ---------------------------------------------------------
  // 4) BOTÃO SEGURO EM CONFIGURAÇÕES
  // ---------------------------------------------------------
  function botao() {
    var body = document.querySelector("#view-config .panel-body");
    if (!body || document.getElementById("publicarTudoBar")) return;
    var div = document.createElement("div");
    div.id = "publicarTudoBar";
    div.className = "crm-final-syncbar";
    div.innerHTML =
      '<span><b>Site público:</b> publica TODOS os imóveis do CRM. Este botão nunca apaga imóveis.</span>' +
      '<button class="btn btn-sm" type="button" onclick="leadsPublicarTodosNoSite(true)">Publicar todos no site agora</button>';
    body.insertBefore(div, body.firstChild);
  }

  function aplicar() {
    abracarSalvar("saveImovelGlobal");
    abracarSalvar("saveImovel");
    abracarFoto("setCoverPhoto");
    abracarFoto("deletePhoto");
    abracarExcluir();
    abracarModal();
    botao();
  }

  // Reaplica algumas vezes porque outros patches redefinem as funções
  // em momentos diferentes; assim garantimos que a nossa versão "pega".
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", aplicar);
  else aplicar();
  window.addEventListener("load", function () {
    setTimeout(aplicar, 1500);
    setTimeout(aplicar, 3500);
    setTimeout(aplicar, 6000);
  });
  var n = 0, t = setInterval(function () { aplicar(); if (++n > 12) clearInterval(t); }, 1200);

  // Ao carregar tudo, publica os imóveis que já existem no CRM (uma vez).
  window.addEventListener("load", function () {
    setTimeout(function () { publicarTodos(false); }, 5000);
  });
})();
</script>
