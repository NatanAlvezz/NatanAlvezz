<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#071018"><title>Leads Imóveis · Ficha do Lead</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="supabase-config.js" defer></script><script src="auth-guard.js" defer></script><link rel="stylesheet" href="crm-modules.css"></head><body><div class="app"><header class="topbar"><a class="brand" href="crm.html"><img src="midia/logo-leads.png.jpeg" alt="Leads Imóveis"><div><strong>LEADS IMÓVEIS</strong><small>CRM NEXT · 2026</small></div></a><nav class="module-nav" id="moduleNav"></nav></header><main class="content">
<section class="hero"><small>Ficha individual</small><h1 id="title">Carregando lead…</h1><p id="subtitle">URL própria para atendimento, histórico e próxima ação.</p><div class="hero-actions"><a class="btn" href="crm-leads.html">Voltar aos leads</a><a class="btn ghost" href="crm.html">CRM</a></div></section><section class="panel"><div class="panel-body" id="detail"><div class="loading">Carregando ficha…</div></div></section>
</main></div><div class="toast" id="toast"></div><script src="crm-modules.js"></script>
<script>
document.addEventListener("DOMContentLoaded",async()=>{renderNav("crm-leads.html");await requireSession();const id=params().get("id");if(!id){$("#detail").innerHTML='<div class="error">Lead não informado.</div>';return}const db=getDb(),{data:l,error}=await db.from("site_leads").select("*").eq("id",id).single();if(error){$("#detail").innerHTML=`<div class="error">${esc(error.message)}</div>`;return}$("#title").textContent=l.name||"Lead sem nome";$("#subtitle").textContent=`${l.intent||"Interesse não informado"} · ${l.neighborhood||"Bairro não informado"}`;const phone=digits(l.phone);$("#detail").innerHTML=`<div class="detail-grid"><div class="detail-list">${[["Status",l.lead_status||l.status],["Temperatura",l.lead_temperature],["Score",l.lead_score],["Telefone",l.phone],["E-mail",l.email],["Interesse",l.intent],["Bairro",l.neighborhood],["Tipo",l.property_type],["Orçamento",l.budget],["Dormitórios",l.bedrooms],["Resumo",l.ai_summary||l.summary],["Próxima ação",l.ai_next_action],["Último contato",dateBR(l.last_contact_at)],["Próximo retorno",dateBR(l.next_follow_up_at)]].map(([a,b])=>`<div class="detail-item"><small>${a}</small><strong>${esc(b??"Não informado")}</strong></div>`).join("")}</div><div><div class="panel" style="margin:0"><div class="panel-head"><h2>Ações</h2></div><div class="panel-body"><div class="card-actions">${phone?`<a class="btn green" target="_blank" rel="noopener" href="https://wa.me/${phone.length<=11?"55":""}${phone}">Abrir WhatsApp</a>`:""}${l.email?`<a class="btn ghost" href="mailto:${encodeURIComponent(l.email)}">Enviar e-mail</a>`:""}</div><div class="notice">Esta página consulta diretamente o lead no Supabase. Alterações feitas no CRM continuam no mesmo registro.</div></div></div></div></div>`});
</script></body></html>
