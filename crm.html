|| undefined);\n      }else if (typeof openImovelModal === \"function\"){\n        openImovelModal(id || undefined);\n      }\n    }catch(error){\n      console.error(\"[CRM Premium] Não foi possível abrir o imóvel:\",error);\n    }\n  }\n\n  function buildExpressPanel(){\n    if (document.getElementById(\"eliteExpressPanel\")) return;\n\n    var sidebar = document.getElementById(\"sidebar\") || document.querySelector(\".sidebar\");\n    var nav = document.getElementById(\"nav\") || document.querySelector(\".sidebar .nav\");\n    if (!sidebar || !nav) return;\n\n    var panel = document.createElement(\"section\");\n    panel.id = \"eliteExpressPanel\";\n    panel.className = \"elite-express\";\n    panel.setAttribute(\"aria-label\",\"Consulta expressa de imóveis\");\n    panel.innerHTML =\n      '<div class=\"elite-express-head\">' +\n        '<strong>Consulta expressa</strong><span aria-hidden=\"true\">⌕</span>' +\n      '</div>' +\n      '<div class=\"elite-express-search\">' +\n        '<input id=\"eliteExpressInput\" autocomplete=\"off\" placeholder=\"Código, imóvel ou proprietário\" aria-label=\"Código, imóvel ou proprietário\">' +\n        '<button id=\"eliteExpressButton\" type=\"button\" title=\"Pesquisar\">→</button>' +\n      '</div>' +\n      '<button class=\"btn elite-new-capture\" id=\"eliteNewCapture\" type=\"button\">＋ Nova captação Elite</button>' +\n      '<div class=\"elite-results\" id=\"eliteExpressResults\" aria-live=\"polite\"></div>';\n\n    sidebar.insertBefore(panel,nav);\n\n    var input = document.getElementById(\"eliteExpressInput\");\n    var button = document.getElementById(\"eliteExpressButton\");\n    var newCapture = document.getElementById(\"eliteNewCapture\");\n\n    function run(){\n      renderExpressResults(input ? input.value : \"\");\n    }\n\n    if (input){\n      input.addEventListener(\"input\",run);\n      input.addEventListener(\"focus\",run);\n      input.addEventListener(\"keydown\",function(event){\n        if (event.key === \"Enter\"){\n          event.preventDefault();\n          run();\n          var first = document.querySelector(\"#eliteExpressResults [data-elite-edit]\");\n          if (first) first.focus();\n        }\n        if (event.key === \"Escape\"){\n          var results = document.getElementById(\"eliteExpressResults\");\n          if (results) results.classList.remove(\"open\");\n        }\n      });\n    }\n\n    if (button) button.addEventListener(\"click\",run);\n    if (newCapture) newCapture.addEventListener(\"click\",function(){ editProperty(); });\n\n    document.addEventListener(\"click\",function(event){\n      var results = document.getElementById(\"eliteExpressResults\");\n      if (!results || panel.contains(event.target)) return;\n      results.classList.remove(\"open\");\n    });\n  }\n\n  function renderExpressResults(query){\n    var container = document.getElementById(\"eliteExpressResults\");\n    if (!container) return;\n\n    var normalized = text(query).trim().toLowerCase();\n    var list = properties().slice();\n\n    if (!normalized){\n      list = list\n        .sort(function(a,b){ return Number(b.updated || b.updated_at || 0) - Number(a.updated || a.updated_at || 0); })\n        .slice(0,4);\n    }else{\n      list = list.filter(function(p){\n        var haystack = [\n          propertyCode(p),\n          propertyTitle(p),\n          propertyOwner(p),\n          propertyPhone(p),\n          p.bairro,\n          p.cidade,\n          p.tipo,\n          p.finalidade\n        ].map(text).join(\" \").toLowerCase();\n        return haystack.indexOf(normalized) !== -1;\n      }).slice(0,6);\n    }\n\n    if (!list.length){\n      container.innerHTML = '<div class=\"elite-empty\">Nenhum imóvel encontrado.</div>';\n      container.classList.add(\"open\");\n      return;\n    }\n\n    container.innerHTML = list.map(function(p){\n      var id = text(p.id);\n      var code = propertyCode(p) || \"SEM CÓDIGO\";\n      var title = propertyTitle(p);\n      var owner = propertyOwner(p) || \"Proprietário não informado\";\n      var phone = propertyPhone(p);\n      var digits = phoneDigits(phone);\n      var where = locationText(p);\n      var whatsapp = digits\n        ? '<a href=\"https://wa.me/' + encodeURIComponent(digits) + '\" target=\"_blank\" rel=\"noopener\">WhatsApp</a>'\n        : '<a href=\"#\" aria-disabled=\"true\" tabindex=\"-1\">Sem telefone</a>';\n\n      return (\n        '<article class=\"elite-result\">' +\n          '<span class=\"elite-result-code\">' + escapeHtml(code) + '</span>' +\n          '<h4>' + escapeHtml(title) + '</h4>' +\n          (where ? '<p>⌂ ' + escapeHtml(where) + '</p>' : '') +\n          '<p>Proprietário: ' + escapeHtml(owner) + '</p>' +\n          (phone ? '<p>Telefone: ' + escapeHtml(phone) + '</p>' : '') +\n          '<div class=\"elite-result-actions\">' +\n            '<button type=\"button\" data-elite-edit=\"' + escapeHtml(id) + '\">Abrir cadastro</button>' +\n            whatsapp +\n          '</div>' +\n        '</article>'\n      );\n    }).join(\"\");\n\n    container.classList.add(\"open\");\n\n    container.querySelectorAll(\"[data-elite-edit]\").forEach(function(button){\n      button.addEventListener(\"click\",function(){\n        editProperty(button.getAttribute(\"data-elite-edit\"));\n      });\n    });\n  }\n\n  function fieldFor(id){\n    var element = document.getElementById(id);\n    return element && element.closest ? element.closest(\".field\") : null;\n  }\n\n  function section(title,className){\n    var block = document.createElement(\"section\");\n    block.className = \"elite-form-section \" + (className || \"\");\n    block.innerHTML =\n      '<h3 class=\"elite-form-section-title\">' + escapeHtml(title) + '</h3>' +\n      '<div class=\"elite-section-grid\"></div>';\n    return block;\n  }\n\n  function moveField(targetGrid,id){\n    var field = fieldFor(id);\n    if (field && field.parentNode !== targetGrid) targetGrid.appendChild(field);\n  }\n\n  function ownerWhatsapp(){\n    var phoneInput = document.getElementById(\"p_tel\");\n    if (!phoneInput) return;\n\n    var field = phoneInput.closest(\".field\");\n    if (!field) return;\n\n    var actions = field.querySelector(\".elite-phone-actions\");\n    if (!actions){\n      actions = document.createElement(\"div\");\n      actions.className = \"elite-phone-actions\";\n      actions.innerHTML = '<a id=\"eliteOwnerWhatsapp\" target=\"_blank\" rel=\"noopener\">Abrir WhatsApp do proprietário</a>';\n      field.appendChild(actions);\n    }\n\n    function update(){\n      var link = document.getElementById(\"eliteOwnerWhatsapp\");\n      if (!link) return;\n      var digits = phoneDigits(phoneInput.value);\n      if (digits){\n        link.href = \"https://wa.me/\" + encodeURIComponent(digits);\n        link.setAttribute(\"aria-disabled\",\"false\");\n      }else{\n        link.href = \"#\";\n        link.setAttribute(\"aria-disabled\",\"true\");\n      }\n    }\n\n    if (!phoneInput.dataset.eliteWhatsappBound){\n      phoneInput.dataset.eliteWhatsappBound = \"true\";\n      phoneInput.addEventListener(\"input\",update);\n    }\n    update();\n  }\n\n  function enhanceCaptureModal(){\n    var titleInput = document.getElementById(\"p_titulo\");\n    var body = document.getElementById(\"modalBody\");\n    if (!titleInput || !body) return;\n\n    var dialog = body.closest(\"dialog\") || document.querySelector(\"dialog[open]\");\n    if (dialog) dialog.classList.add(\"elite-capture-dialog\");\n\n    var modalTitle = document.getElementById(\"modalTitle\");\n    if (modalTitle && !document.getElementById(\"eliteCaptureBadge\")){\n      var badge = document.createElement(\"span\");\n      badge.id = \"eliteCaptureBadge\";\n      badge.className = \"elite-capture-badge\";\n      badge.textContent = \"Captação Elite\";\n      modalTitle.insertAdjacentElement(\"afterend\",badge);\n    }\n\n    var originalGrid = titleInput.closest(\".form-grid\");\n    if (!originalGrid) return;\n\n    var shell = body.querySelector(\".elite-form-shell\");\n    if (!shell){\n      shell = document.createElement(\"div\");\n      shell.className = \"elite-form-shell\";\n      originalGrid.parentNode.insertBefore(shell,originalGrid);\n      shell.appendChild(originalGrid);\n      originalGrid.style.display = \"contents\";\n\n      var propertySection = section(\"Detalhes do imóvel\",\"elite-section-property\");\n      propertySection.id = \"elitePropertySection\";\n      var ownerSection = section(\"Dados do proprietário\",\"elite-section-owner\");\n      ownerSection.id = \"eliteOwnerSection\";\n      var notesSection = section(\"Observações, responsável e fotos\",\"elite-section-notes\");\n      notesSection.id = \"eliteNotesSection\";\n\n      shell.appendChild(propertySection);\n      shell.appendChild(ownerSection);\n      shell.appendChild(notesSection);\n    }\n\n    var propertyGrid = document.querySelector(\"#elitePropertySection .elite-section-grid\");\n    var ownerGrid = document.querySelector(\"#eliteOwnerSection .elite-section-grid\");\n    var notesGrid = document.querySelector(\"#eliteNotesSection .elite-section-grid\");\n    if (!propertyGrid || !ownerGrid || !notesGrid) return;\n\n    [\n      \"p_codigo\",\"p_titulo\",\"p_finalidade\",\"p_tipo\",\"p_bairro\",\"p_cidade\",\n      \"p_valor\",\"p_area\",\"p_dorm\",\"p_suites\",\"p_vagas\",\"p_etapa\",\n      \"p_publicar\",\"p_origem\"\n    ].forEach(function(id){ moveField(propertyGrid,id); });\n\n    [\"p_prop\",\"p_tel\",\"p_captado_por\",\"p_captador\",\"p_captador_email\"]\n      .forEach(function(id){ moveField(ownerGrid,id); });\n\n    [\"p_acao\"].forEach(function(id){ moveField(notesGrid,id); });\n\n    var remaining = Array.prototype.slice.call(originalGrid.querySelectorAll(\":scope > .field\"));\n    remaining.forEach(function(field){ notesGrid.appendChild(field); });\n\n    ownerWhatsapp();\n\n    var saveButton = document.querySelector(\"#modalFoot .btn:last-child\");\n    if (saveButton && /salvar/i.test(saveButton.textContent)){\n      saveButton.textContent = \"Salvar captação Elite\";\n    }\n  }\n\n  function improveTopSearch(){\n    var input = document.getElementById(\"globalSearch\");\n    if (!input) return;\n    input.placeholder = \"Buscar leads, imóveis, códigos, proprietários...\";\n    input.setAttribute(\"aria-label\",\"Busca global do CRM\");\n  }\n\n  function observeModal(){\n    var body = document.getElementById(\"modalBody\");\n    if (!body || !window.MutationObserver) return;\n\n    var queued = false;\n    var observer = new MutationObserver(function(){\n      if (queued) return;\n      queued = true;\n      setTimeout(function(){\n        queued = false;\n        enhanceCaptureModal();\n      },20);\n    });\n\n    observer.observe(body,{childList:true,subtree:true});\n  }\n\n  function boot(){\n    buildExpressPanel();\n    improveTopSearch();\n    observeModal();\n    enhanceCaptureModal();\n\n    setTimeout(buildExpressPanel,500);\n    setTimeout(enhanceCaptureModal,500);\n    setTimeout(enhanceCaptureModal,1200);\n  }\n\n  if (document.readyState === \"loading\"){\n    document.addEventListener(\"DOMContentLoaded\",boot,{once:true});\n  }else{\n    boot();\n  }\n\n  window.addEventListener(\"load\",function(){\n    setTimeout(boot,250);\n  },{once:true});\n})();\n";
  var TIMEOUT_MS = 14000;

  function loaderScreen(message, detail){
    document.body.innerHTML =
      '<main class="loader-card">' +
        '<div class="loader-logo">LI</div>' +
        '<p class="loader-kicker">LEADS IMÓVEIS</p>' +
        '<h1>' + message + '</h1>' +
        '<p>' + detail + '</p>' +
        '<button type="button" onclick="location.reload()">Tentar novamente</button>' +
      '</main>';
  }

  async function fetchWithTimeout(url){
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); },TIMEOUT_MS);
    try{
      var response = await fetch(url,{
        mode:"cors",
        credentials:"omit",
        cache:"force-cache",
        signal:controller.signal
      });
      if(!response.ok) throw new Error("HTTP " + response.status);
      return await response.text();
    }finally{
      clearTimeout(timer);
    }
  }

  function validate(html){
    var required = [
      "<!DOCTYPE html",
      "supabase-config.js",
      "auth-guard.js",
      "openImovelModal",
      "Sair com segurança",
      "globalSearch",
      "</body>",
      "</html>"
    ];
    return required.every(function(token){ return html.indexOf(token) !== -1; });
  }

  function inject(html, supabaseCode){
    var style =
      '<style id="leadsCrmPremiumCorporateStyles">' +
      PREMIUM_CSS +
      '</style>';

    var script =
      '<script id="leadsCrmPremiumCorporateModule">' +
      PREMIUM_JS.replace(/<\/script/gi,"<\\/script") +
      '<' + '/script>';

    // A ARQUITETURA INLINE SÍNCRONA
    // Em vez de usar defer ou manter o link, pegamos o código puro baixado
    // e criamos uma tag <script> gigantesca com ele.
    if (supabaseCode) {
      html = html.replace(
        /<script\b[^>]*src=["'][^"']*supabase-js[^"']*["'][^>]*><\/script>/gi,
        "<script>\n" + supabaseCode + "\n<" + "/script>"
      );
    }

    html = html.replace(/<\/head>/i,style + "\n</head>");
    html = html.replace(/<\/body>\s*<\/html>\s*$/i,script + "\n</body>\n</html>");
    return html;
  }

  async function start(){
    var errors = [];
    
    // NOVIDADE: Baixamos o Supabase *ANTES* de renderizar a tela.
    var supabaseCode = "";
    try {
      supabaseCode = await fetchWithTimeout("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2");
    } catch(e) {
      console.warn("[Loader] Falha ao pré-carregar Supabase. Mantendo original.");
    }

    for(var index=0;index<SOURCES.length;index++){
      try{
        var html = await fetchWithTimeout(SOURCES[index]);
        if(!validate(html)) throw new Error("Arquivo-base incompleto");
        
        var finalHtml = inject(html, supabaseCode);
        
        document.open("text/html","replace");
        document.write(finalHtml);
        document.close();
        return;
      }catch(error){
        errors.push(String(error && error.message || error));
      }
    }

    loaderScreen(
      "Não foi possível carregar o CRM",
      "Verifique a internet e tente novamente. Detalhes: " + errors.join(" · ")
    );
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded",start,{once:true});
  }else{
    start();
  }
})();
  </script>
