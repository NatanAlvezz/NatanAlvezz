    document.querySelectorAll("p,small,.muted,.hint").forEach(function(element){

  function setAiMinimized(value){

  function setBootError(message){
    var card=document.getElementById("bootCard");
    var title=document.getElementById("bootTitle");
    var text=document.getElementById("bootText");
    if(card)card.classList.add("error");
    if(title)title.textContent="Não foi possível abrir o CRM";
    if(text)text.textContent=message;
  }

  async function fetchText(url){
    var controller=new AbortController();
    var timer=setTimeout(function(){controller.abort()},TIMEOUT_MS);
    try{
      var response=await fetch(url,{mode:"cors",credentials:"omit",cache:"no-store",signal:controller.signal});
      if(!response.ok)throw new Error("HTTP "+response.status);
      return await response.text();
    }finally{clearTimeout(timer)}
  }

  function validate(html){
    var required=["<!DOCTYPE html","supabase-config.js","auth-guard.js","openImovelModal","globalSearch","</body>","</html>"];
    return required.every(function(token){return html.indexOf(token)!==-1});
  }

  function prepare(parsed){
    var scripts=[];
    Array.prototype.slice.call(parsed.querySelectorAll("script")).forEach(function(original,index){
      var source=String(original.getAttribute("src")||"");
      var code=String(original.textContent||"");

      // A biblioteca já foi carregada uma única vez no <head> deste arquivo.
      // Removemos qualquer segunda chamada vinda do CRM importado.
      if(/(?:cdn\.jsdelivr\.net|unpkg\.com)\/.*@supabase\/supabase-js@2/i.test(source)){
        original.remove();
        return;
      }

      // Proteção adicional contra carregadores antigos que injetavam o Supabase
      // usando document.write dentro de um script inline.
      if(/document\.write/i.test(code) && /@supabase\/supabase-js@2/i.test(code)){
        original.remove();
        return;
      }

      var marker=parsed.createElement("template");
      var markerId="li-script-marker-"+index;
      marker.setAttribute("data-li-script-marker",markerId);
      var attrs={};
      Array.prototype.slice.call(original.attributes||[]).forEach(function(attr){attrs[attr.name]=attr.value});
      scripts.push({markerId:markerId,attrs:attrs,code:code});
      original.parentNode.replaceChild(marker,original);
    });
    var style=parsed.createElement("style");
    style.id="leadsCrmCorporateFinalStyles";
    style.textContent=CORPORATE_CSS;
    parsed.head.appendChild(style);
    var marker=parsed.createElement("template");
    marker.setAttribute("data-li-enhancement-marker","1");
    parsed.body.appendChild(marker);
    return scripts;
  }

  function copyAttributes(source,target){
    Array.prototype.slice.call(target.attributes||[]).forEach(function(attr){target.removeAttribute(attr.name)});
    Array.prototype.slice.call(source.attributes||[]).forEach(function(attr){target.setAttribute(attr.name,attr.value)});
  }

  function scriptElement(descriptor){
    var script=document.createElement("script");
    Object.keys(descriptor.attrs||{}).forEach(function(name){script.setAttribute(name,descriptor.attrs[name])});
    if(!script.hasAttribute("async"))script.async=false;
    if(!script.src)script.textContent=descriptor.code||"";
    return script;
  }

  function waitExternal(script){
    return new Promise(function(resolve,reject){
      var done=false;
      var timer=setTimeout(function(){if(done)return;done=true;reject(new Error("Tempo esgotado ao carregar "+(script.src||"script")))},TIMEOUT_MS);
      script.addEventListener("load",function(){if(done)return;done=true;clearTimeout(timer);resolve()},{once:true});
      script.addEventListener("error",function(){if(done)return;done=true;clearTimeout(timer);reject(new Error("Falha ao carregar "+(script.src||"script")))},{once:true});
    });
  }

  async function mount(html){
    var parsed=new DOMParser().parseFromString(html,"text/html");
    var scripts=prepare(parsed);
    document.title=parsed.title||"Leads Imóveis · CRM Corporativo";
    copyAttributes(parsed.documentElement,document.documentElement);
    copyAttributes(parsed.body,document.body);
    document.head.innerHTML=parsed.head.innerHTML;
    document.body.innerHTML=parsed.body.innerHTML;

    for(var i=0;i<scripts.length;i++){
      var descriptor=scripts[i];
      var marker=document.querySelector('template[data-li-script-marker="'+descriptor.markerId+'"]');
      if(!marker)continue;
      var script=scriptElement(descriptor);
      marker.parentNode.replaceChild(script,marker);
      if(script.src)await waitExternal(script);
    }

    var enhancementMarker=document.querySelector('template[data-li-enhancement-marker="1"]');
    var enhancement=document.createElement("script");
    enhancement.id="leadsCrmCorporateFinalScript";
    enhancement.textContent=CORPORATE_JS;
    if(enhancementMarker)enhancementMarker.parentNode.replaceChild(enhancement,enhancementMarker);
    else document.body.appendChild(enhancement);
  }

  async function start(){
    if(window.__LEADS_CRM_STARTING__)return;
    window.__LEADS_CRM_STARTING__=true;

    var errors=[];
    var selectedHtml="";

    // Os endereços são apenas alternativas de download. O CRM é montado uma vez.
    for(var i=0;i<SOURCES.length;i++){
      try{
        var candidate=await fetchText(SOURCES[i]);
        if(!validate(candidate))throw new Error("arquivo-base incompleto");
        selectedHtml=candidate;
        break;
      }catch(error){
        errors.push(String(error&&error.message||error));
      }
    }

    if(!selectedHtml){
      window.__LEADS_CRM_STARTING__=false;
      setBootError("Confira sua conexão e tente novamente. "+errors.join(" · "));
      return;
    }

    try{
      await mount(selectedHtml);
      window.__LEADS_CRM_MOUNTED__=true;
    }catch(error){
      window.__LEADS_CRM_STARTING__=false;
      setBootError("Falha ao iniciar o CRM: "+String(error&&error.message||error));
    }
  }

  start();
})();
