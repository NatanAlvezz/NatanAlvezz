      function PremiumModule(){
        "use strict";

        if (window.__LEADS_PREMIUM_SAFE_MODULE__) return;
        window.__LEADS_PREMIUM_SAFE_MODULE__ = "20260714-destravado";

        var STORAGE_KEY = "leads_crm_cor_layout_total_v4";

        var THEMES = [
          ["Dourado Luxo", "#d8b56d", "#f1d28c"],
          ["Azul Prime", "#4f8cff", "#7ab8ff"],
          ["Verde Elite", "#35c77a", "#8be0b0"],
          ["Rubi", "#e5485d", "#ff8293"],
          ["Ametista", "#9b6cff", "#d1b4ff"],
          ["Turquesa", "#22c7c9", "#7ce6df"],
          ["Cobre", "#c97841", "#f0ad71"],
          ["Prata", "#9ba7b4", "#d7dde5"],
          ["Grafite", "#69717d", "#aab0b9"],
          ["Rosa", "#e569ac", "#ffacd4"],
          ["Coral", "#ff6f61", "#ffad91"],
          ["Laranja", "#ff8a3d", "#ffc16b"],
          ["Limão", "#9fd43f", "#d4f177"],
          ["Esmeralda", "#00a878", "#63dfb5"],
          ["Oceano", "#0077b6", "#48cae4"],
          ["Azul Royal", "#405de6", "#7c8cff"],
          ["Violeta", "#7b2cbf", "#c77dff"],
          ["Magenta", "#d81b60", "#ff6fa5"],
          ["Chocolate", "#8d5524", "#c68642"],
          ["Aurora", "#00b4d8", "#a855f7"]
        ];

        function text(value){
          return value == null ? "" : String(value);
        }

        function normalize(value){
          return text(value)
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g,"")
            .replace(/\s+/g," ")
            .trim()
            .toLowerCase();
        }

        function escapeHtml(value){
          return text(value)
            .replace(/&/g,"&amp;")
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;")
            .replace(/'/g,"&#039;");
        }

        function validHex(value){
          return /^#[0-9a-f]{6}$/i.test(text(value));
        }

        function mix(hex, amount){
          hex = validHex(hex) ? hex.replace("#","") : "d8b56d";

          var n = parseInt(hex,16);
          var target = amount < 0 ? 0 : 255;
          var factor = Math.abs(amount);

          var r = n >> 16;
          var g = (n >> 8) & 255;
          var b = n & 255;

          r = Math.round(r + (target - r) * factor);
          g = Math.round(g + (target - g) * factor);
          b = Math.round(b + (target - b) * factor);

          return "#" + [r,g,b].map(function(v){
            return v.toString(16).padStart(2,"0");
          }).join("");
        }

        function contrast(hex){
          hex = validHex(hex) ? hex.replace("#","") : "d8b56d";

          var r = parseInt(hex.slice(0,2),16);
          var g = parseInt(hex.slice(2,4),16);
          var b = parseInt(hex.slice(4,6),16);

          return ((r * 299 + g * 587 + b * 114) / 1000) > 155 ? "#111318" : "#ffffff";
        }

        function applyTheme(name, a, b, save){
          if (!validHex(a)) a = "#d8b56d";
          if (!validHex(b)) b = mix(a,.35);
          if (save !== false) save = true;

          var root = document.documentElement;

          var vars = {
            "--gold": a,
            "--gold-2": b,
            "--gold2": b,
            "--accent": a,
            "--accent-2": b,
            "--accent2": b,
            "--brand": a,
            "--brand-2": b,
            "--brand2": b,
            "--primary": a,
            "--primary-2": b,
            "--primary2": b,
            "--highlight": a,
            "--focus": a,
            "--ring": a,
            "--button": a,
            "--button-2": b,
            "--li-a": a,
            "--li-b": b,
            "--elite-theme-a": a,
            "--elite-theme-b": b,
            "--leads-theme-a": a,
            "--leads-theme-b": b,
            "--theme-color": a,
            "--text-on-theme": contrast(a)
          };

          Object.keys(vars).forEach(function(key){
            root.style.setProperty(key, vars[key]);
          });

          root.setAttribute("data-leads-theme-ready", "1");

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", mix(a,-.72));

          document.querySelectorAll("[data-leads-theme-name]").forEach(function(btn){
            btn.classList.toggle("active", btn.getAttribute("data-leads-theme-name") === name);
          });

          document.querySelectorAll("[data-leads-current-theme]").forEach(function(el){
            el.textContent = name || "Cor personalizada";
          });

          if (save) {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify({ name:name, a:a, b:b }));
            } catch (_error) {}
          }
        }

        function restoreTheme(){
          try {
            var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");

            if (saved && validHex(saved.a) && validHex(saved.b)) {
              applyTheme(saved.name || "Cor personalizada", saved.a, saved.b, false);
              return;
            }
          } catch (_error) {}

          applyTheme("Dourado Luxo", "#d8b56d", "#f1d28c", false);
        }

        function buildThemePanel(){
          var panel = document.createElement("section");
          panel.className = "leads-theme-panel";

          var buttons = THEMES.map(function(item){
            return [
              '<button type="button" class="leads-theme-btn"',
              ' data-leads-theme-name="' + escapeHtml(item[0]) + '"',
              ' data-a="' + item[1] + '"',
              ' data-b="' + item[2] + '"',

              '<span class="leads-theme-name">' + escapeHtml(item[0]) + '</span>',
              '</button>'
            ].join("");
          }).join("");

          panel.innerHTML = [
            '<div class="leads-theme-head">',

              '<button type="button" data-apply-custom>Aplicar no CRM inteiro</button>',
            '</div>'
          ].join("");

          panel.querySelectorAll("[data-leads-theme-name]").forEach(function(btn){
            btn.addEventListener("click", function(){
              applyTheme(
                btn.getAttribute("data-leads-theme-name"),
                btn.getAttribute("data-a"),
                btn.getAttribute("data-b"),
                true
              );
            });
          });

          var picker = panel.querySelector("[data-custom-color]");
          var apply = panel.querySelector("[data-apply-custom]");

          if (picker && apply) {
            apply.addEventListener("click", function(){
              var color = picker.value || "#d8b56d";
              applyTheme("Cor personalizada", color, mix(color,.35), true);
            });
          }

          return panel;
        }

        function findSettingsContainer(){
          var headings = document.querySelectorAll("h1,h2,h3,h4,h5,[role='heading']");

          for (var i = 0; i < headings.length; i++) {
            var content = normalize(headings[i].textContent);

            if (
              content.indexOf("configuracoes") !== -1 ||
              content.indexOf("configuracao") !== -1
            ) {
              return headings[i].closest(".panel,.view,section,article,main,div") || headings[i].parentElement;
            }
          }

          var candidates = document.querySelectorAll(".panel,.view,section,article,main,div");

          for (var j = 0; j < candidates.length; j++) {
            var candidateText = normalize(candidates[j].textContent);

            if (
              candidateText.indexOf("salvar agora") !== -1 &&
              candidateText.indexOf("sair com seguranca") !== -1
            ) {
              return candidates[j];
            }
          }

          return null;
        }

        function cleanOldConfigCopy(container){

          var removeTexts = [

          container.querySelectorAll("button").forEach(function(btn){

            if (

              content === "azul prime" ||
              content === "verde elite"
            ) {
              btn.classList.add("leads-hide-config-copy");
            }
          });
        }

        function installThemeInSettings(){
          if (document.getElementById("leadsThemeSettingsPanel")) {
            restoreTheme();
            return true;
          }

          var container = findSettingsContainer();

          if (!container) return false;

          cleanOldConfigCopy(container);

          var panel = buildThemePanel();
          panel.id = "leadsThemeSettingsPanel";

          container.appendChild(panel);

          restoreTheme();

          return true;
        }

        function improveAIConsultiva(){
          var rightbar = document.querySelector(".rightbar");

          if (rightbar) {
            rightbar.setAttribute("data-ai-compacta", "true");
          }

          var titles = document.querySelectorAll(
            ".rightbar h1,.rightbar h2,.rightbar h3,.ai-panel h1,.ai-panel h2,.ai-panel h3,.chat-panel h1,.chat-panel h2,.chat-panel h3"
          );

          titles.forEach(function(title){
            title.textContent = title.textContent
              .replace(/consultiva da ia/ig, "IA consultiva")
              .replace(/consultiva/ig, "Consultiva");
          });
        }

        function improveTopSearch(){
          var input = document.getElementById("globalSearch");

          if (input) {
            input.placeholder = "Buscar leads, imóveis, códigos, proprietários...";
            input.setAttribute("aria-label", "Busca global do CRM");
          }
        }

        function boot(){
          restoreTheme();
          installThemeInSettings();
          improveAIConsultiva();
          improveTopSearch();

          setTimeout(function(){
            installThemeInSettings();
            improveAIConsultiva();
            improveTopSearch();
          }, 600);

          setTimeout(function(){
            installThemeInSettings();
            improveAIConsultiva();
          }, 1500);
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", boot, { once:true });
        } else {
          boot();
        }

        window.addEventListener("load", function(){
          setTimeout(boot, 250);
        }, { once:true });

        if (window.MutationObserver) {
          var observer = new MutationObserver(function(){
            installThemeInSettings();
            improveAIConsultiva();
          });

          observer.observe(document.documentElement, {
            childList:true,
            subtree:true
          });
        }
      }

      function showError(message, detail){
        document.body.innerHTML =
          '<main class="loader-card">' +
            '<div class="loader-logo">LI</div>' +
            '<p class="loader-kicker">LEADS IMÓVEIS</p>' +
            '<h1>' + message + '</h1>' +
            '<p>' + detail + '</p>' +
            '<button type="button" onclick="location.reload()">Tentar novamente</button>' +
          '</main>';
      }

      async function fetchWithTimeout(url){
        var controller = new AbortController();
        var timer = setTimeout(function(){
          controller.abort();
        }, TIMEOUT_MS);

        try {
          var response = await fetch(url, {
            mode:"cors",
            credentials:"omit",
            cache:"no-store",
            signal:controller.signal
          });

          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          return await response.text();
        } finally {
          clearTimeout(timer);
        }
      }

      function validate(html){
        if (!html || html.length < 10000) return false;
        if (html.indexOf("supabase-config.js") === -1) return false;
        if (html.indexOf("auth-guard.js") === -1) return false;
        if (html.indexOf("</body>") === -1) return false;
        if (html.indexOf("</html>") === -1) return false;
        return true;
      }

      function inject(html){
        var style =
          '<style id="leadsLayoutSeguroStyles">' +
          PREMIUM_CSS +
          '</style>';

        var premiumScript =
          '<script id="leadsLayoutSeguroModule">(' +
          PremiumModule.toString().replace(/<\/script/gi, "<\\/script") +
          ')();<' + '/script>';

        html = html.replace(
          /<meta name="theme-color" content="[^"]*">/i,
          '<meta name="theme-color" content="#07080a">'
        );

        html = html.replace(/<\/head>/i, style + "\n</head>");
        html = html.replace(/<\/body>\s*<\/html>\s*$/i, premiumScript + "\n</body>\n</html>");

        return html;
      }

      async function start(){
        var errors = [];

        for (var i = 0; i < SOURCES.length; i++) {
          try {
            var html = await fetchWithTimeout(SOURCES[i]);

            if (!validate(html)) {
              throw new Error("Arquivo-base incompleto");
            }

            var finalHtml = inject(html);

            document.open("text/html", "replace");
            document.write(finalHtml);
            document.close();

            return;
          } catch (error) {
            errors.push(String(error && error.message || error));
          }
        }

        showError(
          "Não foi possível carregar o CRM",
          "O carregador destravou, mas não conseguiu buscar o CRM base. Detalhes: " + errors.join(" · ")
        );
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", start, { once:true });
      } else {
        start();
      }
    })();
  </script>
</body>
</html>
