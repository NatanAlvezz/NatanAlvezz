(function LeadsCrmPremiumOrganizado(){

  var THEMES = [
    ["Dourado Luxo", "#d8b56d", "#f1d28c"],

  function text(value){ return value == null ? "" : String(value); }
  function normalizar(value){ return text(value).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim().toLowerCase(); }
  function escapeHtml(value){ return text(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
  function validHex(value){ return /^#[0-9a-f]{6}$/i.test(text(value)); }

  function mix(hex, amount){
    hex = validHex(hex) ? hex.replace("#","") : "d8b56d";
    var n = parseInt(hex,16), target = amount < 0 ? 0 : 255, factor = Math.abs(amount);
    var r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    r = Math.round(r + (target - r) * factor);
    g = Math.round(g + (target - g) * factor);

  function contrast(hex){
    hex = validHex(hex) ? hex.replace("#","") : "d8b56d";
    var r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);

    root.setAttribute("data-leads-theme-ready","1");

    document.querySelectorAll("[data-leads-theme-name]").forEach(function(btn){

      '<div class="leads-theme-custom">' +
        '<label>Cor personalizada</label>' +
        '<input type="color" value="#d8b56d" data-custom-color>' +
        '<button type="button" data-apply-custom>Aplicar no CRM inteiro</button>' +
      '</div>';

    panel.querySelectorAll("[data-leads-theme-name]").forEach(function(btn){
      btn.addEventListener("click",function(){
        applyTheme(btn.getAttribute("data-leads-theme-name"), btn.getAttribute("data-a"), btn.getAttribute("data-b"));
      });
    });

    var picker = panel.querySelector("[data-custom-color]");
    var apply = panel.querySelector("[data-apply-custom]");

    if (picker && apply){
      apply.addEventListener("click",function(){
        var a = picker.value || "#d8b56d";
        applyTheme("Cor personalizada", a, mix(a,.35));
      });
    }

    return panel;
  }

  function findSettingsContainer(){
    var headings = document.querySelectorAll("h1,h2,h3,h4,h5,[role='heading']");

    for (var i=0;i<headings.length;i++){
      var t = normalizar(headings[i].textContent);
      if (t.indexOf("configuracoes") !== -1 || t.indexOf("configuracoes e dados") !== -1){
        return headings[i].closest(".panel,.view,section,article,main,div") || headings[i].parentElement;
      }
    }

    return null;
  }

  function cleanSettingsText(container){
    if (!container) return;

    var remove = [
      "nuvem, seguranca e sincronizacao automatica",
      "imoveis da equipe: crm_properties e a fonte oficial",
      "o crm salva localmente e sincroniza no supabase automaticamente",
      "operacao final para corretores",
      "muda a cor principal, fundo, paineis escuros",
      "temas completos do layout"
    ];

    container.querySelectorAll("p,small,span,div,strong,h3,h4").forEach(function(el){
      var t = normalizar(el.textContent);
      if (remove.some(function(x){ return t.indexOf(x) !== -1; })){
        el.classList.add("leads-hide-config-copy");
      }
    });

    container.querySelectorAll("button").forEach(function(btn){
      var t = normalizar(btn.textContent);
      if (t === "dourado luxo" || t === "azul prime" || t === "verde elite"){
        btn.classList.add("leads-hide-config-copy");
      }
    });
  }

  function installThemePanel(){
    if (document.getElementById("leadsThemeSettingsPanel")) return;

    var container = findSettingsContainer();
    if (container){
      cleanSettingsText(container);
      container.appendChild(buildThemePanel("leadsThemeSettingsPanel"));
      restoreTheme();
    }
  }

  function installFloatingThemeButton(){
    if (document.getElementById("leadsThemeFloatButton")) return;

    var btn = document.createElement("button");
    btn.id = "leadsThemeFloatButton";
    btn.className = "leads-theme-float";
    btn.type = "button";
    btn.title = "Mudar cor do CRM inteiro";
    btn.textContent = "🎨";

    var panel = buildThemePanel("leadsThemeFloatingPanel");
    panel.classList.add("leads-theme-floating-panel");

    document.body.appendChild(panel);
    document.body.appendChild(btn);

    btn.addEventListener("click",function(){
      panel.classList.toggle("open");
    });

    document.addEventListener("keydown",function(event){
      if (event.key === "Escape") panel.classList.remove("open");
    });

    restoreTheme();
  }

  function database(){
    try{ if (typeof db !== "undefined" && db) return db; }catch(_error){}
    return window.db || window.database || window.crmDB || null;
  }

  function properties(){
    var source = database();
    if (!source) return [];
    var list = source.imoveis || source.properties || [];
    return Array.isArray(list) ? list : [];
  }

  function propertyCode(p){ return text(p.codigo || p.code || p.referencia || p.reference || p.ref || p.codigo_imovel || ""); }
  function propertyTitle(p){ return text(p.titulo || p.title || p.nome || p.name || p.tipo || "Imóvel sem título"); }
  function propertyOwner(p){ return text(p.prop || p.proprietario || p.owner_name || p.owner || p.nome_proprietario || ""); }
  function propertyPhone(p){ return text(p.tel || p.telefone || p.owner_phone || p.telefone_proprietario || p.whatsapp || ""); }

  function phoneDigits(value){
    var d = text(value).replace(/\D/g,"");
    if (!d) return "";
    if (d.length === 10 || d.length === 11) d = "55" + d;
    return d;
  }

  function locationText(p){
    return [p.bairro,p.cidade].filter(Boolean).join(" · ");
  }

  function editProperty(id){
    try{
      if (typeof window.openImovelModal === "function"){
        window.openImovelModal(id || undefined);
      }else if (typeof openImovelModal === "function"){
        openImovelModal(id || undefined);
      }
    }catch(error){
      console.error("[CRM Premium] Erro ao abrir imóvel",error);
    }
  }

  function buildExpressPanel(){
    if (document.getElementById("leadsExpressPanel")) return;

    var sidebar = document.getElementById("sidebar") || document.querySelector(".sidebar");
    var nav = document.getElementById("nav") || document.querySelector(".sidebar .nav");

    if (!sidebar || !nav) return;

    var box = document.createElement("section");
    box.id = "leadsExpressPanel";
    box.className = "leads-express-box";

    box.innerHTML =
      '<div class="leads-express-head">' +
        '<strong>Consulta expressa</strong><span>⌕</span>' +
      '</div>' +
      '<div class="leads-express-search">' +
        '<input id="leadsExpressInput" autocomplete="off" placeholder="Código, imóvel ou proprietário">' +
        '<button id="leadsExpressButton" type="button">→</button>' +
      '</div>' +
      '<button class="btn leads-express-new" id="leadsNewCapture" type="button">＋ Nova captação Elite</button>' +
      '<div class="leads-express-results" id="leadsExpressResults" aria-live="polite"></div>';

    sidebar.insertBefore(box,nav);

    var input = document.getElementById("leadsExpressInput");
    var button = document.getElementById("leadsExpressButton");
    var newCapture = document.getElementById("leadsNewCapture");

    function run(){
      renderExpressResults(input ? input.value : "");
    }

    if (input){
      input.addEventListener("input",run);
      input.addEventListener("focus",run);
      input.addEventListener("keydown",function(event){
        if (event.key === "Enter"){
          event.preventDefault();
          run();
        }

        if (event.key === "Escape"){
          var r = document.getElementById("leadsExpressResults");
          if (r) r.classList.remove("open");
        }
      });
    }

    if (button) button.addEventListener("click",run);
    if (newCapture) newCapture.addEventListener("click",function(){ editProperty(); });
  }

  function renderExpressResults(query){
    var container = document.getElementById("leadsExpressResults");
    if (!container) return;

    var q = text(query).trim().toLowerCase();
    var list = properties().slice();

    if (!q){
      list = list.slice(-4).reverse();
    }else{
      list = list.filter(function(p){
        var haystack = [
          propertyCode(p),
          propertyTitle(p),
          propertyOwner(p),
          propertyPhone(p),
          p.bairro,
          p.cidade,
          p.tipo,
          p.finalidade
        ].map(text).join(" ").toLowerCase();

        return haystack.indexOf(q) !== -1;
      }).slice(0,6);
    }

    if (!list.length){
      container.innerHTML = '<div class="leads-express-empty">Nenhum imóvel encontrado.</div>';
      container.classList.add("open");
      return;
    }

    container.innerHTML = list.map(function(p){
      var id = text(p.id);
      var code = propertyCode(p) || "SEM CÓDIGO";
      var title = propertyTitle(p);
      var owner = propertyOwner(p) || "Proprietário não informado";
      var phone = propertyPhone(p);
      var digits = phoneDigits(phone);
      var where = locationText(p);

      var whatsapp = digits
        ? '<a href="https://wa.me/' + encodeURIComponent(digits) + '" target="_blank" rel="noopener">WhatsApp</a>'
        : '<a href="#" aria-disabled="true" tabindex="-1">Sem telefone</a>';

      return (
        '<article class="leads-express-item">' +
          '<span class="leads-express-code">' + escapeHtml(code) + '</span>' +
          '<h4>' + escapeHtml(title) + '</h4>' +
          (where ? '<p>⌂ ' + escapeHtml(where) + '</p>' : '') +
          '<p>Proprietário: ' + escapeHtml(owner) + '</p>' +
          (phone ? '<p>Telefone: ' + escapeHtml(phone) + '</p>' : '') +
          '<div class="leads-express-actions">' +
            '<button type="button" data-leads-edit="' + escapeHtml(id) + '">Abrir cadastro</button>' +
            whatsapp +
          '</div>' +
        '</article>'
      );
    }).join("");

    container.classList.add("open");

    container.querySelectorAll("[data-leads-edit]").forEach(function(button){
      button.addEventListener("click",function(){
        editProperty(button.getAttribute("data-leads-edit"));
      });
    });
  }

  function fieldFor(id){
    var el = document.getElementById(id);
    return el && el.closest ? el.closest(".field") : null;
  }

  function section(title,className){
    var block = document.createElement("section");
    block.className = "leads-form-section " + (className || "");
    block.innerHTML =
      '<h3 class="leads-form-section-title">' + escapeHtml(title) + '</h3>' +
      '<div class="leads-section-grid"></div>';
    return block;
  }

  function moveField(target,id){
    var field = fieldFor(id);
    if (field && field.parentNode !== target) target.appendChild(field);
  }

  function ownerWhatsapp(){
    var phoneInput = document.getElementById("p_tel");
    if (!phoneInput) return;

    var field = phoneInput.closest(".field");
    if (!field) return;

    var actions = field.querySelector(".leads-owner-actions");

    if (!actions){
      actions = document.createElement("div");
      actions.className = "leads-owner-actions";
      actions.innerHTML = '<a id="leadsOwnerWhatsapp" target="_blank" rel="noopener">Abrir WhatsApp do proprietário</a>';
      field.appendChild(actions);
    }

    function update(){
      var link = document.getElementById("leadsOwnerWhatsapp");
      if (!link) return;

      var d = phoneDigits(phoneInput.value);

      if (d){
        link.href = "https://wa.me/" + encodeURIComponent(d);
        link.setAttribute("aria-disabled","false");
      }else{
        link.href = "#";
        link.setAttribute("aria-disabled","true");
      }
    }

    if (!phoneInput.dataset.leadsWhatsappBound){
      phoneInput.dataset.leadsWhatsappBound = "true";
      phoneInput.addEventListener("input",update);
    }

    update();
  }

  function enhanceCaptureModal(){
    var titleInput = document.getElementById("p_titulo");
    var body = document.getElementById("modalBody");

    if (!titleInput || !body) return;

    var dialog = body.closest("dialog") || document.querySelector("dialog[open]");
    if (dialog) dialog.classList.add("leads-capture-dialog");

    var modalTitle = document.getElementById("modalTitle");

    if (modalTitle && !document.getElementById("leadsCaptureBadge")){
      var badge = document.createElement("span");
      badge.id = "leadsCaptureBadge";
      badge.className = "leads-capture-badge";
      badge.textContent = "Captação Elite";
      modalTitle.insertAdjacentElement("afterend",badge);
    }

    var originalGrid = titleInput.closest(".form-grid");
    if (!originalGrid) return;

    var shell = body.querySelector(".leads-form-shell");

    if (!shell){
      shell = document.createElement("div");
      shell.className = "leads-form-shell";
      originalGrid.parentNode.insertBefore(shell,originalGrid);
      shell.appendChild(originalGrid);
      originalGrid.style.display = "contents";

      var prop = section("Detalhes do imóvel","leads-section-property");
      prop.id = "leadsPropertySection";

      var owner = section("Dados do proprietário","leads-section-owner");
      owner.id = "leadsOwnerSection";

      var notes = section("Observações, responsável e fotos","leads-section-notes");
      notes.id = "leadsNotesSection";

      shell.appendChild(prop);
      shell.appendChild(owner);
      shell.appendChild(notes);
    }

    var propertyGrid = document.querySelector("#leadsPropertySection .leads-section-grid");
    var ownerGrid = document.querySelector("#leadsOwnerSection .leads-section-grid");
    var notesGrid = document.querySelector("#leadsNotesSection .leads-section-grid");

    if (!propertyGrid || !ownerGrid || !notesGrid) return;

    [
      "p_codigo","p_titulo","p_finalidade","p_tipo","p_bairro","p_cidade",
      "p_valor","p_area","p_dorm","p_suites","p_vagas","p_etapa",
      "p_publicar","p_origem"
    ].forEach(function(id){ moveField(propertyGrid,id); });

    [
      "p_prop","p_tel","p_captado_por","p_captador","p_captador_email"
    ].forEach(function(id){ moveField(ownerGrid,id); });

    ["p_acao"].forEach(function(id){ moveField(notesGrid,id); });

    Array.prototype.slice.call(originalGrid.querySelectorAll(":scope > .field")).forEach(function(field){
      notesGrid.appendChild(field);
    });

    ownerWhatsapp();

    var saveButton = document.querySelector("#modalFoot .btn:last-child");
    if (saveButton && /salvar/i.test(saveButton.textContent)){
      saveButton.textContent = "Salvar captação Elite";
    }
  }

  function improveTopSearch(){
    var input = document.getElementById("globalSearch");

    if (input){
      input.placeholder = "Buscar leads, imóveis, códigos, proprietários...";
      input.setAttribute("aria-label","Busca global do CRM");
    }
  }

  function observeModal(){
    var body = document.getElementById("modalBody");

    if (!body || !window.MutationObserver || body.dataset.leadsObserver) return;

    body.dataset.leadsObserver = "true";

    var queued = false;

    new MutationObserver(function(){
      if (queued) return;

      queued = true;

      setTimeout(function(){
        queued = false;
        enhanceCaptureModal();
        installThemePanel();
      },30);
    }).observe(body,{childList:true,subtree:true});
  }

  function boot(){
    restoreTheme();
    installFloatingThemeButton();
    installThemePanel();
    buildExpressPanel();
    improveTopSearch();
    observeModal();
    enhanceCaptureModal();

    setTimeout(function(){
      installThemePanel();
      buildExpressPanel();
      enhanceCaptureModal();
    },500);

    setTimeout(function(){
      installThemePanel();
      enhanceCaptureModal();
    },1400);
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded",boot,{once:true});
  }else{
    boot();
  }

  window.addEventListener("load",function(){
    setTimeout(boot,250);
  },{once:true});
})();

    function loaderScreen(message, detail){
      document.body.innerHTML =
        '<main class="loader-card">' +
          '<div class="loader-logo">LI</div>' +
          '<p class="loader-kicker">LEADS IMÓVEIS</p>' +
          '<h1>' + message + '</h1>' +
          '<p>' + detail + '</p>' +
          '<button type="button" onclick="location.reload()">Tentar novamente</button>' +
        '</main>';
    }

    async function fetchWithTimeout(url){
      var controller = new AbortController();
      var timer = setTimeout(function(){ controller.abort(); }, TIMEOUT_MS);

      try{
        var response = await fetch(url,{
          mode:"cors",
          credentials:"omit",
          cache:"no-store",
          signal:controller.signal
        });

        if (!response.ok) throw new Error("HTTP " + response.status);

        return await response.text();
      }finally{
        clearTimeout(timer);
      }
    }

    function validate(html){
      var required = [
        "<!DOCTYPE html",
        "supabase-config.js",
        "auth-guard.js",
        "openImovelModal",
        "globalSearch",
        "</body>",
        "</html>"
      ];

      return required.every(function(token){
        return html.indexOf(token) !== -1;
      });
    }

    function inject(html){
      var style =
        '<style id="leadsCrmPremiumLayoutStyles">' +
        PREMIUM_CSS +
        '</style>';

      var script =
        '<script id="leadsCrmPremiumLayoutModule">' +
        PREMIUM_JS.replace(/<\/script/gi,"<\\/script") +
        '<' + '/script>';

      html = html.replace(
        /<meta name="theme-color" content="[^"]*">/i,
        '<meta name="theme-color" content="#07080a">'
      );

      html = html.replace(/<\/head>/i, style + '\n</head>');
      html = html.replace(/<\/body>\s*<\/html>\s*$/i, script + '\n</body>\n</html>');

      return html;
    }

    async function start(){
      var errors = [];

      for (var i=0;i<SOURCES.length;i++){
        try{
          var html = await fetchWithTimeout(SOURCES[i]);

          if (!validate(html)){
            throw new Error("Arquivo-base incompleto");
          }

          var finalHtml = inject(html);

          document.open("text/html","replace");
          document.write(finalHtml);
          document.close();

          return;
        }catch(error){
          errors.push(String(error && error.message || error));
        }
      }

      loaderScreen(
        "Não foi possível carregar o CRM",
        "Verifique a internet e tente novamente. Detalhes: " + errors.join(" · ")
      );
    }

    if (document.readyState === "loading"){
      document.addEventListener("DOMContentLoaded",start,{once:true});
    }else{
      start();
    }
  })();
  </script>
