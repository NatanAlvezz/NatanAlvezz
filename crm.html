  var TIMEOUT_MS = 14000;

  function loaderScreen(message, detail){

  async function fetchWithTimeout(url){
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); },TIMEOUT_MS);
    try{
      var response = await fetch(url,{
        mode:"cors",
        credentials:"omit",
        cache:"force-cache",
        signal:controller.signal
      });
      if(!response.ok) throw new Error("HTTP " + response.status);
      return await response.text();
    }finally{
      clearTimeout(timer);
    }
  }

  function validate(html){
    return html.indexOf("<!DOCTYPE html") !== -1;
  }

  function inject(html, supabaseCode){
    var style = '<style id="leadsCrmPremiumCorporateStyles">' + PREMIUM_CSS + '</style>';
    var script = '<script id="leadsCrmPremiumCorporateModule">' + PREMIUM_JS.replace(/<\/script/gi,"<\\/script") + '<' + '/script>';

    if (supabaseCode) {
      html = html.replace(/<script\b[^>]*src=["'][^"']*supabase-js[^"']*["'][^>]*><\/script>/gi, "<script>\n" + supabaseCode + "\n<" + "/script>");
    }

    html = html.replace(/<\/head>/i,style + "\n</head>");
    html = html.replace(/<\/body>\s*<\/html>\s*$/i,script + "\n</body>\n</html>");
    return html;
  }

        document.close();
        return;
      }catch(error){
        errors.push(String(error));
      }
    }
    loaderScreen("Não foi possível carregar o CRM", "Detalhes: " + errors.join(" · "));
  }

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded",start,{once:true});
  else start();
})();
  </script>
</body>
</html>
