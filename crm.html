    const target = amount < 0 ? 0 : 255;
    const factor = Math.abs(amount);

    let r = n >> 16;
    let g = (n >> 8) & 255;
    let b = n & 255;

    r = Math.round(r + (target - r) * factor);
    g = Math.round(g + (target - g) * factor);
    b = Math.round(b + (target - b) * factor);

    return "#" + [r,g,b].map(v => v.toString(16).padStart(2,"0")).join("");
  }

  function contrast(hex){
    hex = validHex(hex) ? hex.replace("#","") : "d8b56d";

    const r = parseInt(hex.slice(0,2),16);
    const g = parseInt(hex.slice(2,4),16);
    const b = parseInt(hex.slice(4,6),16);

    return ((r * 299 + g * 587 + b * 114) / 1000) > 155 ? "#111318" : "#ffffff";
  }

  function applyTheme(name, a, b, save = true){
    if (!validHex(a)) a = "#d8b56d";
    if (!validHex(b)) b = mix(a, .35);

    const root = document.documentElement;

    const vars = {
      "--gold": a,
      "--gold-2": b,
      "--gold2": b,
      "--accent": a,
      "--accent-2": b,
      "--accent2": b,
      "--brand": a,
      "--brand-2": b,
      "--brand2": b,
      "--primary": a,
      "--primary-2": b,
      "--primary2": b,
      "--highlight": a,
      "--focus": a,
      "--ring": a,
      "--button": a,
      "--button-2": b,
      "--li-a": a,
      "--li-b": b,
      "--elite-theme-a": a,
      "--elite-theme-b": b,
      "--leads-theme-a": a,
      "--leads-theme-b": b,
      "--theme-color": a,
      "--text-on-theme": contrast(a)
    };

    Object.keys(vars).forEach(key => {
      root.style.setProperty(key, vars[key]);
    });

    root.setAttribute("data-leads-theme-ready", "1");

    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", mix(a, -.72));

    document.querySelectorAll("[data-leads-theme-name]").forEach(btn => {
      btn.classList.toggle("active", btn.getAttribute("data-leads-theme-name") === name);
    });

    document.querySelectorAll("[data-leads-current-theme]").forEach(el => {
      el.textContent = name || "Cor personalizada";
    });

    if (save) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ name, a, b }));
      } catch (_error) {}
    }
  }

  function restoreTheme(){
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");

      if (saved && validHex(saved.a) && validHex(saved.b)) {
        applyTheme(saved.name || "Cor personalizada", saved.a, saved.b, false);
        return;
      }
    } catch (_error) {}

    applyTheme("Dourado Luxo", "#d8b56d", "#f1d28c", false);
  }

  function buildThemePanel(){
    const panel = document.createElement("section");
    panel.className = "leads-theme-panel";

    const buttons = THEMES.map(item => {
      return `
        <button
          type="button"
          class="leads-theme-btn"
          data-leads-theme-name="${escapeHtml(item[0])}"
          data-a="${item[1]}"
          data-b="${item[2]}"
          style="--theme-a:${item[1]};--theme-b:${item[2]}"
        >
          <span class="leads-theme-swatch"></span>
          <span class="leads-theme-name">${escapeHtml(item[0])}</span>
        </button>
      `;
    }).join("");

    panel.innerHTML = `
      <div class="leads-theme-head">
        <h3>Cores do layout inteiro</h3>
        <span class="leads-theme-current" data-leads-current-theme>Dourado Luxo</span>
      </div>

      <div class="leads-theme-grid">
        ${buttons}
      </div>

      <div class="leads-theme-custom">
        <label>Cor personalizada</label>
        <input type="color" value="#d8b56d" data-custom-color>
        <button type="button" data-apply-custom>Aplicar no CRM inteiro</button>
      </div>
    `;

    panel.querySelectorAll("[data-leads-theme-name]").forEach(btn => {
      btn.addEventListener("click", () => {
        applyTheme(
          btn.getAttribute("data-leads-theme-name"),
          btn.getAttribute("data-a"),
          btn.getAttribute("data-b")
        );
      });
    });

    const picker = panel.querySelector("[data-custom-color]");
    const apply = panel.querySelector("[data-apply-custom]");

    if (picker && apply) {
      apply.addEventListener("click", () => {
        const color = picker.value || "#d8b56d";
        applyTheme("Cor personalizada", color, mix(color, .35));
      });
    }

    return panel;
  }

  function findSettingsContainer(){
    const headings = document.querySelectorAll("h1,h2,h3,h4,h5,[role='heading']");

    for (const heading of headings) {
      const content = normalize(heading.textContent);

      if (
        content.includes("configuracoes") ||
        content.includes("configuracoes e dados") ||
        content.includes("configuração") ||
        content.includes("configurações")
      ) {
        return heading.closest(".panel,.view,section,article,main,div") || heading.parentElement;
      }
    }

    const candidates = document.querySelectorAll(".panel,.view,section,article,main,div");

    for (const candidate of candidates) {
      const content = normalize(candidate.textContent);

      if (
        content.includes("salvar agora") &&
        content.includes("sair com seguranca")
      ) {
        return candidate;
      }
    }

    return null;
  }

  function cleanOldConfigCopy(container){
    if (!container) return;

    const removeTexts = [
      "nuvem, seguranca e sincronizacao automatica",
      "imoveis da equipe: crm_properties e a fonte oficial",
      "o crm salva localmente e sincroniza no supabase automaticamente",
      "operacao final para corretores",
      "muda a cor principal, fundo, paineis escuros",
      "temas completos do layout"
    ];

    container.querySelectorAll("p,small,span,div,strong,h3,h4").forEach(el => {
      const content = normalize(el.textContent);

      if (removeTexts.some(text => content.includes(text))) {
        el.classList.add("leads-hide-config-copy");
      }
    });

    container.querySelectorAll("button").forEach(btn => {
      const content = normalize(btn.textContent);

      if (
        content === "dourado luxo" ||
        content === "azul prime" ||
        content === "verde elite"
      ) {
        btn.classList.add("leads-hide-config-copy");
      }
    });
  }

  function installThemeInSamePlace(){
    if (document.getElementById("leadsThemeSettingsPanel")) {
      restoreTheme();
      return true;
    }

    const container = findSettingsContainer();

    if (!container) return false;

    cleanOldConfigCopy(container);

    const panel = buildThemePanel();
    panel.id = "leadsThemeSettingsPanel";

    container.appendChild(panel);

    restoreTheme();

    return true;
  }

  function database(){
    try {
      if (typeof db !== "undefined" && db) return db;
    } catch (_error) {}

    return window.db || window.database || window.crmDB || null;
  }

  function properties(){
    const source = database();
    if (!source) return [];

    const list = source.imoveis || source.properties || [];

    return Array.isArray(list) ? list : [];
  }

  function propertyCode(p){
    return txt(p.codigo || p.code || p.referencia || p.reference || p.ref || p.codigo_imovel || "");
  }

  function propertyTitle(p){
    return txt(p.titulo || p.title || p.nome || p.name || p.tipo || "Imóvel sem título");
  }

  function propertyOwner(p){
    return txt(p.prop || p.proprietario || p.owner_name || p.owner || p.nome_proprietario || "");
  }

  function propertyPhone(p){
    return txt(p.tel || p.telefone || p.owner_phone || p.telefone_proprietario || p.whatsapp || "");
  }

  function phoneDigits(value){
    let digits = txt(value).replace(/\D/g, "");

    if (!digits) return "";

    if (digits.length === 10 || digits.length === 11) {
      digits = "55" + digits;
    }

    return digits;
  }

  function locationText(p){
    return [p.bairro, p.cidade].filter(Boolean).join(" · ");
  }

  function editProperty(id){
    try {
      if (typeof window.openImovelModal === "function") {
        window.openImovelModal(id || undefined);
      } else if (typeof openImovelModal === "function") {
        openImovelModal(id || undefined);
      }
    } catch (error) {
      console.error("[Leads CRM] Erro ao abrir imóvel:", error);
    }
  }

  function buildExpressPanel(){
    if (document.getElementById("leadsExpressPanel")) return;

    const sidebar = document.getElementById("sidebar") || document.querySelector(".sidebar");
    const nav = document.getElementById("nav") || document.querySelector(".sidebar .nav");

    if (!sidebar || !nav) return;

    const box = document.createElement("section");
    box.id = "leadsExpressPanel";
    box.className = "leads-express-box";

    box.innerHTML = `
      <div class="leads-express-head">
        <strong>Consulta expressa</strong>
        <span>⌕</span>
      </div>

      <div class="leads-express-search">
        <input id="leadsExpressInput" autocomplete="off" placeholder="Código, imóvel ou proprietário">
        <button id="leadsExpressButton" type="button">→</button>
      </div>

      <button class="btn leads-express-new" id="leadsNewCapture" type="button">
        ＋ Nova captação
      </button>

      <div class="leads-express-results" id="leadsExpressResults" aria-live="polite"></div>
    `;

    sidebar.insertBefore(box, nav);

    const input = document.getElementById("leadsExpressInput");
    const button = document.getElementById("leadsExpressButton");
    const newCapture = document.getElementById("leadsNewCapture");

    function run(){
      renderExpressResults(input ? input.value : "");
    }

    if (input) {
      input.addEventListener("input", run);
      input.addEventListener("focus", run);
      input.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          run();
        }

        if (event.key === "Escape") {
          const results = document.getElementById("leadsExpressResults");
          if (results) results.classList.remove("open");
        }
      });
    }

    if (button) button.addEventListener("click", run);
    if (newCapture) newCapture.addEventListener("click", () => editProperty());
  }

  function renderExpressResults(query){
    const container = document.getElementById("leadsExpressResults");

    if (!container) return;

    const q = txt(query).trim().toLowerCase();

    let list = properties().slice();

    if (!q) {
      list = list.slice(-4).reverse();
    } else {
      list = list.filter(p => {
        const haystack = [
          propertyCode(p),
          propertyTitle(p),
          propertyOwner(p),
          propertyPhone(p),
          p.bairro,
          p.cidade,
          p.tipo,
          p.finalidade
        ].map(txt).join(" ").toLowerCase();

        return haystack.includes(q);
      }).slice(0, 5);
    }

    if (!list.length) {
      container.innerHTML = '<div class="leads-express-empty">Nenhum imóvel encontrado.</div>';
      container.classList.add("open");
      return;
    }

    container.innerHTML = list.map(p => {
      const id = txt(p.id);
      const code = propertyCode(p) || "SEM CÓDIGO";
      const title = propertyTitle(p);
      const owner = propertyOwner(p) || "Proprietário não informado";
      const phone = propertyPhone(p);
      const digits = phoneDigits(phone);
      const where = locationText(p);

      const whatsapp = digits
        ? `<a href="https://wa.me/${encodeURIComponent(digits)}" target="_blank" rel="noopener">WhatsApp</a>`
        : `<a href="#" aria-disabled="true" tabindex="-1">Sem telefone</a>`;

      return `
        <article class="leads-express-item">
          <span class="leads-express-code">${escapeHtml(code)}</span>
          <h4>${escapeHtml(title)}</h4>
          ${where ? `<p>⌂ ${escapeHtml(where)}</p>` : ""}
          <p>Proprietário: ${escapeHtml(owner)}</p>
          ${phone ? `<p>Telefone: ${escapeHtml(phone)}</p>` : ""}
          <div class="leads-express-actions">
            <button type="button" data-leads-edit="${escapeHtml(id)}">Abrir</button>
            ${whatsapp}
          </div>
        </article>
      `;
    }).join("");

    container.classList.add("open");

    container.querySelectorAll("[data-leads-edit]").forEach(button => {
      button.addEventListener("click", () => {
        editProperty(button.getAttribute("data-leads-edit"));
      });
    });
  }

  function improveAIConsultiva(){
    const rightbar = document.querySelector(".rightbar");

    if (rightbar) {
      rightbar.setAttribute("data-ai-compacta", "true");
    }

    const possibleTitles = document.querySelectorAll(".rightbar h1,.rightbar h2,.rightbar h3,.ai-panel h1,.ai-panel h2,.ai-panel h3,.chat-panel h1,.chat-panel h2,.chat-panel h3");

    possibleTitles.forEach(title => {
      const content = normalize(title.textContent);

      if (
        content.includes("consultiva") ||
        content.includes("ia") ||
        content.includes("lia")
      ) {
        title.textContent = title.textContent
          .replace(/consultiva da ia/ig, "IA consultiva")
          .replace(/consultiva/ig, "Consultiva");
      }
    });
  }

  function improveTopSearch(){
    const input = document.getElementById("globalSearch");

    if (input) {
      input.placeholder = "Buscar leads, imóveis, códigos, proprietários...";
      input.setAttribute("aria-label", "Busca global do CRM");
    }
  }

  function boot(){
    restoreTheme();
    installThemeInSamePlace();
    buildExpressPanel();
    improveAIConsultiva();
    improveTopSearch();

    setTimeout(() => {
      installThemeInSamePlace();
      buildExpressPanel();
      improveAIConsultiva();
      improveTopSearch();
    }, 500);

    setTimeout(() => {
      installThemeInSamePlace();
      improveAIConsultiva();
    }, 1400);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once:true });
  } else {
    boot();
  }

  window.addEventListener("load", () => {
    setTimeout(boot, 250);
  }, { once:true });

  if (window.MutationObserver) {
    const observer = new MutationObserver(() => {
      installThemeInSamePlace();
      improveAIConsultiva();
    });

    observer.observe(document.documentElement, {
      childList:true,
      subtree:true
    });
  }
})();
`;

      function showError(message, detail){
        document.body.innerHTML =
          '<main class="loader-card">' +
            '<div class="loader-logo">LI</div>' +
            '<p class="loader-kicker">LEADS IMÓVEIS</p>' +
            '<h1>' + message + '</h1>' +
            '<p>' + detail + '</p>' +
            '<button type="button" onclick="location.reload()">Tentar novamente</button>' +
          '</main>';
      }

      async function fetchWithTimeout(url){
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);

        try {
          const response = await fetch(url, {
            mode:"cors",
            credentials:"omit",
            cache:"no-store",
            signal:controller.signal
          });

          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          return await response.text();
        } finally {
          clearTimeout(timer);
        }
      }

      function validate(html){
        const required = [
          "<!DOCTYPE html",
          "supabase-config.js",
          "auth-guard.js",
          "openImovelModal",
          "globalSearch",
          "</body>",
          "</html>"
        ];

        return required.every(token => html.includes(token));
      }

      function inject(html){
        const style =
          '<style id="leadsLayoutInteiroFinalStyles">' +
          PREMIUM_CSS +
          '</style>';

        const script =
          '<script id="leadsLayoutInteiroFinalModule">' +
          PREMIUM_JS.replace(/<\/script/gi, "<\\/script") +
          '<' + '/script>';

        html = html.replace(
          /<meta name="theme-color" content="[^"]*">/i,
          '<meta name="theme-color" content="#07080a">'
        );

        html = html.replace(/<\/head>/i, style + "\n</head>");
        html = html.replace(/<\/body>\s*<\/html>\s*$/i, script + "\n</body>\n</html>");

        return html;
      }

      async function start(){
        const errors = [];

        for (const source of SOURCES) {
          try {
            const html = await fetchWithTimeout(source);

            if (!validate(html)) {
              throw new Error("Arquivo-base incompleto");
            }

            const finalHtml = inject(html);

            document.open("text/html", "replace");
            document.write(finalHtml);
            document.close();

            return;
          } catch (error) {
            errors.push(String(error && error.message || error));
          }
        }

        showError(
          "Não foi possível carregar o CRM",
          "Verifique a internet e tente novamente. Detalhes: " + errors.join(" · ")
        );
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", start, { once:true });
      } else {
        start();
      }
    })();
  </script>
