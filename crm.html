<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07080a">
  <meta name="robots" content="noindex,nofollow">
  <title>Leads Imóveis · CRM Premium Organizado</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#050506;color:#f7f4ed;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0%,rgba(216,181,109,.18),transparent 35%),#050506}
    .loader-card{width:min(470px,94vw);padding:30px;border:1px solid rgba(216,181,109,.28);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.02));box-shadow:0 30px 100px rgba(0,0,0,.6);text-align:center}
    .loader-logo{width:66px;height:66px;margin:0 auto 15px;border:1px solid rgba(216,181,109,.55);border-radius:20px;display:grid;place-items:center;color:#ffe8aa;background:radial-gradient(circle,#312612,#090909);font-family:Georgia,serif;font-size:20px}
    .loader-kicker{margin:0 0 8px;color:#d8b56d;font-size:10px;font-weight:900;letter-spacing:2.2px}
    h1{margin:0;font-size:21px}p{color:#aaa69d;line-height:1.55;font-size:13px}
    button{min-height:43px;padding:10px 16px;border:1px solid rgba(216,181,109,.55);border-radius:12px;color:#171006;background:linear-gradient(135deg,#efd28f,#d8b56d);font-weight:900;cursor:pointer}
    .spinner{width:28px;height:28px;margin:18px auto 0;border:3px solid rgba(255,255,255,.10);border-top-color:#d8b56d;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="loader-card">
    <div class="loader-logo">LI</div>
    <p class="loader-kicker">LEADS IMÓVEIS</p>
    <h1>Inicializando CRM organizado</h1>
    <p>Preservando imóveis, leads, fotos, perfil, Supabase e todas as funções atuais.</p>
    <div class="spinner" aria-label="Carregando"></div>
  </main>
  <!--
  ARQUITETURA SEGURA DO CRM
  01. Mantém o CRM-base original.
  02. Mantém todos os imóveis existentes.
  03. Mantém todos os leads existentes.
  04. Mantém fotos e capas dos imóveis.
  05. Mantém o perfil do corretor.
  06. Mantém o perfil do administrador.
  07. Mantém autenticação existente.
  08. Mantém integração Supabase existente.
  09. Mantém salvamento automático.
  10. Mantém sincronização em tempo real.
  11. Mantém cadastro de leads.
  12. Mantém edição de leads.
  13. Mantém cadastro de imóveis.
  14. Mantém edição de imóveis.
  15. Mantém publicação no site.
  16. Mantém imóveis internos.
  17. Mantém tarefas e prioridades.
  18. Mantém relatórios.
  19. Mantém chat da IA.
  20. Não cria outro cliente Supabase.
  21. Não altera tabelas do banco.
  22. Não altera políticas RLS.
  23. Não inclui chave secreta.
  24. Não substitui listas do CRM.
  25. Não cria modal sobre os imóveis.
  26. Não duplica a navegação original.
  27. Adiciona somente organização visual.
  28. Adiciona abas seguras de filtro.
  29. Adiciona busca expressa integrada.
  30. Adiciona controle para recolher menu.
  31. Adiciona controle para minimizar IA.
  32. Mantém layout desktop.
  33. Mantém layout celular.
  34. Mantém compatibilidade com TV 4K.
  -->
  <script>
(function LeadsCrmOrganizedLoader(){
  "use strict";
  var SOURCES=[
    "https://raw.githubusercontent.com/NatanAlvezz/NatanAlvezz/1a43ab2441dd0c33e2cc8bf9bc00a0556f534ca8/crm.html",
    "https://cdn.jsdelivr.net/gh/NatanAlvezz/NatanAlvezz@1a43ab2441dd0c33e2cc8bf9bc00a0556f534ca8/crm.html"
  ];
  var PREMIUM_CSS=`
:root{--elite-side:260px;--elite-ai:330px;--elite-line:rgba(255,255,255,.10);--elite-surface:rgba(255,255,255,.035);--elite-radius:15px}
body{background:radial-gradient(circle at 15% -10%,rgba(216,181,109,.13),transparent 31%),linear-gradient(145deg,#050506,#090a0d 55%,#040405)!important}
.app{grid-template-columns:var(--elite-side) minmax(0,1fr) var(--elite-ai)!important}
.sidebar{padding:12px 10px!important;gap:10px!important}.nav{gap:5px!important}
.nav button{min-height:42px!important;padding:9px 11px!important;border-radius:11px!important;font-size:12px!important}
.topbar{min-height:66px!important;padding:10px 14px!important}.content{max-width:1500px!important;padding:14px!important}
.panel{margin-bottom:13px!important}.panel-head{padding:13px 15px!important}.panel-body{padding:14px 15px!important}
.grid-kpi,.two-col,.cards,.grid-list{gap:12px!important}.kpi{min-height:92px!important;padding:14px!important}
.item-card,.property-card,.smart-box{border-radius:var(--elite-radius)!important;box-shadow:0 10px 28px rgba(0,0,0,.22)!important}
.rightbar{padding:12px 10px!important}.ai-card{height:calc(100dvh - 24px)!important;display:flex!important;flex-direction:column!important}
.chat-log{flex:1!important;min-height:180px!important;max-height:none!important}
.elite-tools{display:grid;gap:7px;padding:9px;border:1px solid rgba(216,181,109,.22);border-radius:13px;background:var(--elite-surface)}
.elite-tools-title{font-size:9px;font-weight:900;letter-spacing:1.4px;color:#d8b56d}.elite-search{display:flex;gap:6px}
.elite-search input{min-height:38px!important;padding:8px 10px!important;font-size:12px!important}.elite-search button{width:38px;min-height:38px!important;padding:0!important}
.elite-tabs{display:flex;gap:7px;overflow-x:auto;padding:0 0 12px;scrollbar-width:thin}
.elite-tab{flex:0 0 auto;min-height:36px!important;padding:7px 11px!important;border-radius:999px!important;background:rgba(255,255,255,.04)!important;border:1px solid rgba(255,255,255,.10)!important;color:#c9c4b9!important;font-size:11px!important}
.elite-tab.active{color:#171006!important;background:linear-gradient(135deg,#efd28f,#d8b56d)!important;border-color:#d8b56d!important}
.elite-page-title{min-width:150px}.elite-page-title small{display:block;color:#8f8b82;font-size:9px;letter-spacing:1.2px}.elite-page-title strong{font-size:15px}
.elite-side-toggle,.elite-ai-control{width:38px!important;height:38px!important;min-height:38px!important;padding:0!important;border-radius:11px!important}
.elite-ai-controls{display:flex;gap:6px;margin-left:auto}.rightbar.elite-ai-mini .ai-hero,.rightbar.elite-ai-mini .ai-section,.rightbar.elite-ai-mini .quick{display:none!important}
.elite-ai-open{display:none;position:fixed;right:16px;bottom:18px;z-index:170;width:54px;height:54px;border-radius:18px;color:#171006;background:linear-gradient(135deg,#efd28f,#d8b56d);font-weight:900;box-shadow:0 14px 35px rgba(0,0,0,.45)}
body.elite-side-closed .app{grid-template-columns:78px minmax(0,1fr) var(--elite-ai)!important}
body.elite-side-closed .brand>div:last-child,body.elite-side-closed .nav button span,body.elite-side-closed .plan,body.elite-side-closed .elite-tools{display:none!important}
body.elite-side-closed .nav button{justify-content:center!important}
body.elite-ai-closed .app{grid-template-columns:var(--elite-side) minmax(0,1fr) 0!important}
body.elite-ai-closed .rightbar{display:none!important}body.elite-ai-closed .elite-ai-open{display:grid;place-items:center}
body.elite-side-closed.elite-ai-closed .app{grid-template-columns:78px minmax(0,1fr) 0!important}
@media(max-width:1180px) and (min-width:981px){.app{grid-template-columns:88px minmax(0,1fr) 310px!important}.elite-tools{display:none}.content{padding:12px!important}.rightbar{padding:10px!important}}
@media(max-width:980px){body{padding-bottom:calc(88px + var(--safe))!important}.app{display:block!important}.content{padding:10px!important}.topbar{gap:8px!important}.elite-page-title{order:2;flex:1}.topbar .search{order:3;width:100%!important}.elite-tabs{padding-bottom:10px}.grid-kpi{grid-template-columns:repeat(2,minmax(0,1fr))!important}.two-col,.smart{grid-template-columns:1fr!important}.rightbar{width:min(390px,100vw)!important}.ai-card{height:100dvh!important}.elite-ai-open{bottom:92px}}
@media(max-width:620px){.grid-kpi,.form-grid,.central-actions{grid-template-columns:1fr!important}.panel-head{align-items:flex-start!important}.panel-head .btn{width:100%}.toolbar{display:grid!important;grid-template-columns:1fr!important}.property-card,.item-card{min-width:0!important}.elite-page-title strong{font-size:13px}}
@media(min-width:1800px){.content{max-width:1700px!important}.app{grid-template-columns:280px minmax(0,1fr) 360px!important}}
`;
  var PREMIUM_JS=`
(function LeadsCrmSafeOrganizer(){
"use strict";
if(window.__LEADS_SAFE_ORGANIZER__)return;
window.__LEADS_SAFE_ORGANIZER__=true;
function byId(id){return document.getElementById(id)}
function call(name){if(typeof window[name]==="function")window[name]()}
function title(view){var names={dashboard:"Visão geral",leads:"Leads e clientes",imoveis:"Carteira de imóveis",tarefas:"Agenda e tarefas",relatorios:"Relatórios",config:"Configurações"};var box=byId("elitePageTitle");if(box)box.querySelector("strong").textContent=names[view]||"CRM Premium"}
function buildTopbar(){var top=document.querySelector(".topbar");if(!top||byId("elitePageTitle"))return;var menu=document.createElement("button");menu.className="round elite-side-toggle";menu.type="button";menu.title="Recolher menu";menu.textContent="☰";menu.onclick=function(){document.body.classList.toggle("elite-side-closed")};top.insertBefore(menu,top.firstChild);var page=document.createElement("div");page.id="elitePageTitle";page.className="elite-page-title";page.innerHTML="<small>LEADS IMÓVEIS</small><strong>Visão geral</strong>";top.insertBefore(page,top.querySelector(".search"))}
function buildSidebarSearch(){var nav=byId("nav"),side=byId("sidebar");if(!nav||!side||byId("eliteSidebarTools"))return;var box=document.createElement("section");box.id="eliteSidebarTools";box.className="elite-tools";box.innerHTML='<div class="elite-tools-title">CONSULTA EXPRESSA</div><div class="elite-search"><input id="eliteQuickSearch" placeholder="Código, cliente ou imóvel"><button type="button" id="eliteQuickButton">⌕</button></div>';side.insertBefore(box,nav);function search(){var value=byId("eliteQuickSearch").value.trim(),global=byId("globalSearch");if(!value||!global)return;global.value=value;call("globalSearch")}byId("eliteQuickButton").onclick=search;byId("eliteQuickSearch").onkeydown=function(e){if(e.key==="Enter")search()}}
function createTabs(viewId,items,handler){var view=byId(viewId);if(!view||view.querySelector(".elite-tabs"))return;var body=view.querySelector(".panel-body");if(!body)return;var tabs=document.createElement("div");tabs.className="elite-tabs";items.forEach(function(item,index){var b=document.createElement("button");b.type="button";b.className="elite-tab"+(index===0?" active":"");b.textContent=item.label;b.onclick=function(){tabs.querySelectorAll(".elite-tab").forEach(function(x){x.classList.remove("active")});b.classList.add("active");handler(item.value)};tabs.appendChild(b)});body.insertBefore(tabs,body.firstChild)}
function buildTabs(){createTabs("view-leads",[{label:"Todos",value:""},{label:"Novos",value:"Novos leads"},{label:"Qualificação",value:"Qualificação"},{label:"Proposta",value:"Proposta"},{label:"Negociação",value:"Negociação"},{label:"Fechados",value:"Fechado"}],function(value){var select=byId("filterLeadStage");if(select){select.value=value;call("renderLeads")}});createTabs("view-imoveis",[{label:"Todos",value:""},{label:"Venda",value:"Venda"},{label:"Aluguel anual",value:"Aluguel Anual"},{label:"Temporada",value:"Temporada"},{label:"Publicados",value:"Publicado"},{label:"Rascunhos",value:"Rascunho"}],function(value){var input=byId("searchImoveis");if(input){input.value=value;call("renderImoveis")}})}
function buildAIControls(){var head=document.querySelector(".ai-head"),right=byId("rightbar");if(!head||!right||byId("eliteAiControls"))return;var controls=document.createElement("div");controls.id="eliteAiControls";controls.className="elite-ai-controls";controls.innerHTML='<button class="btn btn-ghost elite-ai-control" type="button" title="Minimizar IA">−</button><button class="btn btn-ghost elite-ai-control" type="button" title="Fechar IA">×</button>';head.appendChild(controls);controls.children[0].onclick=function(){right.classList.toggle("elite-ai-mini")};controls.children[1].onclick=function(){document.body.classList.add("elite-ai-closed")};var open=document.createElement("button");open.className="elite-ai-open";open.type="button";open.textContent="IA";open.onclick=function(){document.body.classList.remove("elite-ai-closed");right.classList.add("open")};document.body.appendChild(open)}
function bindNavigation(){document.querySelectorAll("#nav button,#mobileNav button").forEach(function(button){button.addEventListener("click",function(){title(button.dataset.view||"dashboard")})})}
function boot(){buildTopbar();buildSidebarSearch();buildTabs();buildAIControls();bindNavigation();title(document.querySelector("#nav button.active")?.dataset.view||"dashboard")}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot,{once:true});else boot();
})();`;
  var TIMEOUT_MS=16000;
  function errorScreen(message,detail){document.body.innerHTML='<main class="loader-card"><div class="loader-logo">LI</div><p class="loader-kicker">LEADS IMÓVEIS</p><h1>'+message+'</h1><p>'+detail+'</p><button type="button" onclick="location.reload()">Tentar novamente</button></main>'}
  async function fetchText(url){var controller=new AbortController();var timer=setTimeout(function(){controller.abort()},TIMEOUT_MS);try{var response=await fetch(url,{mode:"cors",credentials:"omit",cache:"no-cache",signal:controller.signal});if(!response.ok)throw new Error("HTTP "+response.status);return await response.text()}finally{clearTimeout(timer)}}
  function valid(html){return html.includes("<!DOCTYPE html")&&html.includes('id="propertyList"')&&html.includes('id="leadList"')&&html.includes("function renderImoveis")}
  function inject(html,supabaseCode){var style='<style id="leadsCrmSafeOrganizerStyles">'+PREMIUM_CSS+'</style>';var script='<script id="leadsCrmSafeOrganizerModule">'+PREMIUM_JS.replace(/<\/script/gi,"<\\/script")+'<'+'/script>';if(supabaseCode)html=html.replace(/<script\b[^>]*src=["'][^"']*supabase-js[^"']*["'][^>]*><\/script>/i,'<script>'+supabaseCode+'<'+'/script>');html=html.replace(/<\/head>/i,style+'\n</head>');html=html.replace(/<\/body>\s*<\/html>\s*$/i,script+'\n</body>\n</html>');return html}
  async function start(){var errors=[];var supabaseCode="";try{supabaseCode=await fetchText("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2")}catch(error){errors.push("Supabase: "+error)}for(var i=0;i<SOURCES.length;i++){try{var html=await fetchText(SOURCES[i]);if(!valid(html))throw new Error("CRM-base incompleto");var finalHtml=inject(html,supabaseCode);document.open("text/html","replace");document.write(finalHtml);document.close();return}catch(error){errors.push(String(error))}}errorScreen("Não foi possível carregar o CRM","Detalhes: "+errors.join(" · "))}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start,{once:true});else start();
})();
  </script>
</body>
</html>
