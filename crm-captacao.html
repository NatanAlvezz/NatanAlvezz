<script>
document.addEventListener("DOMContentLoaded",async()=>{renderNav("crm-captacao-especial.html");await requireSession();const id=params().get("id");if(!id){$("#detail").innerHTML='<div class="error">Captação não informada.</div>';return}const db=getDb(),{data:c,error}=await db.from("captacoes_radar").select("*").eq("id",id).single();if(error){$("#detail").innerHTML=`<div class="error">${esc(error.message)}</div>`;return}$("#title").textContent=`${c.tipo_imovel||"Imóvel"} · ${c.bairro||"Sem bairro"}`;$("#subtitle").textContent=`${c.origem_tipo||c.origem||"Origem não informada"} · atualização ${dateBR(c.updated_at)}`;const phone=digits(c.telefone),allowed=c.consentimento_contato&&!c.opt_out_at;$("#detail").innerHTML=`<div class="detail-grid"><div class="detail-list">${[["Proprietário",c.nome_proprietario],["Telefone",allowed?c.telefone:"Contato protegido"],["E-mail",allowed?c.email_proprietario:"Contato protegido"],["Endereço",[c.endereco,c.numero,c.complemento,c.bairro,c.cidade,c.uf,c.cep].filter(Boolean).join(", ")],["Tipo",c.tipo_imovel],["Preço",c.preco],["Inscrição imobiliária",c.inscricao_imobiliaria],["Matrícula",c.matricula_imovel],["Origem",c.origem_tipo||c.origem],["Detalhe da origem",c.origem_detalhe],["Base legal",c.base_legal],["Status",c.status],["Temperatura",c.temperature],["Score",c.score],["Próximo retorno",dateBR(c.next_follow_up_at)],["Notas",c.notas]].map(([a,b])=>`<div class="detail-item"><small>${a}</small><strong>${esc(b??"Não informado")}</strong></div>`).join("")}</div><div><div class="panel" style="margin:0"><div class="panel-head"><h2>Ações autorizadas</h2></div><div class="panel-body"><div class="card-actions">${allowed&&phone?`<a class="btn green" target="_blank" rel="noopener" href="https://wa.me/${phone.length<=11?"55":""}${phone}">WhatsApp</a>`:""}${allowed&&c.email_proprietario?`<a class="btn ghost" href="mailto:${encodeURIComponent(c.email_proprietario)}">E-mail</a>`:""}${c.property_id?`<a class="btn" href="crm-imovel.html?id=${encodeURIComponent(c.property_id)}">Abrir imóvel convertido</a>`:""}</div><div class="notice">${allowed?"Contato autorizado para atendimento.":"Contato indisponível: sem consentimento ativo ou com opt-out."}</div></div></div></div></div>`});
