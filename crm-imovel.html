<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#071018"><title>Leads Imóveis · Ficha do Imóvel</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="supabase-config.js" defer></script><script src="auth-guard.js" defer></script><link rel="stylesheet" href="crm-modules.css"></head><body><div class="app"><header class="topbar"><a class="brand" href="crm.html"><img src="midia/logo-leads.png.jpeg" alt="Leads Imóveis"><div><strong>LEADS IMÓVEIS</strong><small>CRM NEXT · 2026</small></div></a><nav class="module-nav" id="moduleNav"></nav></header><main class="content">
<section class="hero"><small>Ficha individual</small><h1 id="title">Carregando imóvel…</h1><p id="subtitle">Todos os dados comerciais e fotos em uma URL interna própria.</p><div class="hero-actions"><a class="btn" href="crm-imoveis.html">Voltar aos imóveis</a><a class="btn ghost" href="crm.html">CRM</a><a class="btn ghost" id="siteLink" target="_blank" rel="noopener" hidden>Ver página pública</a></div></section><section class="panel"><div class="panel-body" id="detail"><div class="loading">Carregando imóvel…</div></div></section>
</main></div><div class="toast" id="toast"></div><script src="crm-modules.js"></script>
<script>
document.addEventListener("DOMContentLoaded",async()=>{renderNav("crm-imoveis.html");await requireSession();const id=params().get("id");if(!id){$("#detail").innerHTML='<div class="error">Imóvel não informado.</div>';return}const db=getDb(),{data:p,error}=await db.from("crm_properties").select("*").eq("id",id).single();if(error){$("#detail").innerHTML=`<div class="error">${esc(error.message)}</div>`;return}const code=p.data?.code||p.code||p.id;$("#title").textContent=p.title||"Imóvel sem título";$("#subtitle").textContent=`${code} · ${p.neighborhood||"-"}, ${p.city||"Florianópolis"}`;if(p.is_public){$("#siteLink").hidden=false;$("#siteLink").href=`imovel.html?codigo=${encodeURIComponent(code)}`}const photos=Array.isArray(p.photos)?p.photos.map(x=>typeof x==="string"?x:x?.url||x?.data).filter(Boolean):[];$("#detail").innerHTML=`<div class="detail-grid"><div><div class="gallery">${photos.map(u=>`<img src="${esc(u)}" alt="${esc(p.title||"Imóvel")}" loading="lazy">`).join("")||'<div class="empty">Sem fotos cadastradas.</div>'}</div></div><div class="detail-list">${[["Código",code],["Finalidade",p.purpose],["Tipo",p.type],["Preço",money(p.price)],["Área",p.area?`${p.area} m²`:"Não informado"],["Dormitórios",p.bedrooms],["Suítes",p.suites],["Vagas",p.parking],["Status",p.status],["Publicação",p.is_public?"Publicado":"Interno"],["Proprietário",p.owner_name],["E-mail do proprietário",p.owner_email],["Captado por",p.captured_by_name],["Descrição",p.description]].map(([a,b])=>`<div class="detail-item"><small>${a}</small><strong>${esc(b??"Não informado")}</strong></div>`).join("")}</div></div>`});
</script></body></html>
