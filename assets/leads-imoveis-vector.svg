<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
  <title id="title">Leads Imóveis</title>
  <desc id="desc">Marca vetorial exclusiva com monograma LA e edifícios.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#d8dce2"/>
      <stop offset=".48" stop-color="#fafafa"/>
      <stop offset=".72" stop-color="#9ba1aa"/>
      <stop offset="1" stop-color="#f4f5f7"/>
    </linearGradient>
    <linearGradient id="champagne" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b48a47"/>
      <stop offset=".48" stop-color="#f2d59b"/>
      <stop offset="1" stop-color="#9f7334"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity=".38"/>
    </filter>
  </defs>

  <g transform="translate(20 22)" filter="url(#softShadow)">
    <path d="M54 25 V220 Q54 255 91 255 H253"
          fill="none" stroke="url(#silver)" stroke-width="18"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M148 245 L254 27 L359 245"
          fill="none" stroke="url(#silver)" stroke-width="18"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M119 252 Q203 287 307 245"
          fill="none" stroke="url(#champagne)" stroke-width="7"
          stroke-linecap="round"/>
    <path d="M205 207 V145 H229 V207 Z
             M244 207 V102 H270 V207 Z
             M284 207 V159 H308 V207 Z"
          fill="url(#silver)"/>
    <path d="M191 209 H322" stroke="url(#champagne)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(418 72)">
    <text x="0" y="86"
          fill="url(#silver)"
          font-family="Montserrat, Inter, Arial, sans-serif"
          font-size="94" font-weight="300" letter-spacing="19">LEADS</text>
    <rect x="2" y="111" width="570" height="3" rx="1.5" fill="url(#champagne)"/>
    <text x="4" y="171"
          fill="#d7dbe1"
          font-family="Montserrat, Inter, Arial, sans-serif"
          font-size="35" font-weight="300" letter-spacing="18">IMÓVEIS</text>
    <text x="5" y="219"
          fill="#aeb3bc"
          font-family="Inter, Arial, sans-serif"
          font-size="15" font-weight="600" letter-spacing="5">TECNOLOGIA • CONFIANÇA • RESULTADO</text>
  </g>
</svg>
