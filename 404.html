<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Página não encontrada · Leads Imóveis</title>
  <script>
    (function () {
      var path = window.location.pathname;
      var property = path.match(/^\/imovel\/([^/?#]+)\/?$/i);
      if (property) {
        location.replace('/imovel.html?codigo=' + encodeURIComponent(decodeURIComponent(property[1])));
        return;
      }
      window.__CRM_MISSING_ROUTE__ = /^\/crm(?:[\/-]|\.html|$)/i.test(path);
    }());
  </script>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0,rgba(101,217,255,.13),transparent 35%),linear-gradient(145deg,#061018,#0a1923);color:#f4fbff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(610px,calc(100% - 30px));padding:34px;border:1px solid rgba(255,255,255,.12);border-radius:25px;background:rgba(255,255,255,.055);box-shadow:0 28px 90px rgba(0,0,0,.38);text-align:center}
    small{color:#d9b66f;font-weight:900;letter-spacing:1.4px;text-transform:uppercase}h1{margin:9px 0;font-size:clamp(27px,6vw,43px)}p{color:#9bb0bd;line-height:1.6}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:20px}a{display:inline-flex;min-height:43px;align-items:center;padding:0 16px;border:1px solid rgba(217,182,111,.35);border-radius:999px;background:rgba(217,182,111,.14);color:#fff4cf;text-decoration:none;font-weight:900;font-size:12px}a.secondary{border-color:rgba(101,217,255,.25);background:rgba(101,217,255,.08);color:#e4faff}
  </style>
</head>
<body>
  <main>
    <small id="label">Leads Imóveis</small>
    <h1 id="title">Página não encontrada</h1>
    <p id="message">O endereço informado não existe ou foi alterado.</p>
    <div class="actions" id="actions"><a href="/">Voltar ao site</a></div>
  </main>
  <script>
    if (window.__CRM_MISSING_ROUTE__) {
      document.getElementById('label').textContent = 'Área interna do CRM';
      document.getElementById('title').textContent = 'Módulo do CRM não encontrado';
      document.getElementById('message').textContent = 'Este arquivo não entrou no último deploy. Você continuará na área interna e poderá voltar ao CRM completo.';
      document.getElementById('actions').innerHTML = '<a href="/crm.html">Voltar ao CRM</a><a class="secondary" href="/login.html">Entrar novamente</a>';
    }
  </script>
</body>
</html>
