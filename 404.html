<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Página não encontrada · Leads Imóveis</title>
  <script>
    (function () {
      var match = window.location.pathname.match(/^\/imovel\/([^/?#]+)\/?$/i);
      if (match) {
        window.location.replace('/imovel.html?codigo=' + encodeURIComponent(decodeURIComponent(match[1])));
      }
    }());
  </script>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071422;color:#effbff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(560px,calc(100% - 32px));padding:34px;text-align:center;border:1px solid rgba(189,239,255,.28);border-radius:26px;background:rgba(255,255,255,.08);box-shadow:0 28px 80px rgba(0,0,0,.3)}
    a{display:inline-flex;margin-top:18px;padding:12px 18px;border-radius:999px;background:#bdefff;color:#071422;text-decoration:none;font-weight:900}
  </style>
</head>
<body>
  <main>
    <h1>Página não encontrada</h1>
    <p>O endereço informado não existe ou foi alterado.</p>
    <a href="/">Voltar ao site</a>
  </main>
</body>
</html>
